/* ==========================================================
   WHAT IF?.. — shared site stylesheet
   Palette and character geometry ported from the episode
   files (Assets/Episodes/*.html) so the site matches the
   show exactly instead of inventing a new look.
   ========================================================== */
:root{
  --navy1:#0b183b; --navy2:#173f72;
  --pale1:#dcf2fc; --pale2:#cfeafa;
  --pro:#f0997b; --proDk:#c66a4f; --proSign:#8a3b28;
  --el:#85b7eb; --elDk:#4f86c9; --elSign:#274f86;
  --cyan:#4db7eb; --cyanDk:#378add;
  --dlg:#0a1733; --dlgEdge:#4db7eb;
  --yellow:#ffd24a; --headBlue:#214a78; --floor:#9bc4dd;

  --ink:#0a1733;
  --sub:#3f5876;
  --muted:#5b7291;
  --ring:#93a7c2;
  --paper:#ffffff;
  --plaqueText:#8a6a1f;

  --maxw:72rem;
}

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background:var(--pale1);
  color:var(--ink);
  font-family:"Trebuchet MS","Segoe UI",system-ui,Arial,sans-serif;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
main{ display:block; }
img,svg{ max-width:100%; }
a{ color:var(--cyanDk); }
h1,h2,h3{ font-family:inherit; line-height:1.2; }
p{ margin:0 0 1em; }

a:focus-visible, button:focus-visible, input:focus-visible, iframe:focus-visible{
  outline:3px solid var(--cyan);
  outline-offset:2px;
}

/* ---------- skip link ---------- */
.skip-link{
  position:absolute; left:-999px; top:0;
  background:#fff; color:var(--ink); font-weight:800;
  padding:12px 18px; border-radius:0 0 10px 0; z-index:200;
  text-decoration:none;
}
.skip-link:focus{ left:0; }

/* ---------- header / nav ---------- */
.site-header{
  background:linear-gradient(180deg,var(--navy1),var(--navy2));
  color:#eef4ff;
}
.nav-inner{
  max-width:var(--maxw); margin:0 auto;
  display:flex; align-items:center; justify-content:space-between;
  gap:16px; flex-wrap:wrap; padding:14px 20px;
}
.brand{
  display:flex; flex-direction:column; line-height:1.1;
  color:#eef4ff; text-decoration:none; font-weight:800; font-size:20px;
  letter-spacing:.3px;
}
.brand span{ font-size:11px; font-weight:600; color:var(--yellow); letter-spacing:.3px; margin-top:2px; }
.brand:hover{ color:#fff; }
.site-nav ul{ list-style:none; display:flex; gap:2px; margin:0; padding:0; flex-wrap:wrap; }
.site-nav a{
  display:inline-block; color:#cfe3f7; text-decoration:none;
  font-weight:700; font-size:14px; padding:9px 14px; border-radius:9px;
}
.site-nav a:hover{ color:#fff; background:rgba(255,255,255,.08); }
.site-nav a[aria-current="page"]{ color:var(--navy1); background:var(--yellow); }
@media (max-width:640px){
  .nav-inner{ flex-direction:column; align-items:flex-start; gap:8px; }
  .site-nav ul{ gap:2px 4px; }
  .site-nav a{ padding:7px 10px; font-size:13px; }
}

/* ---------- footer ---------- */
.site-footer{ background:var(--navy1); color:#9fb6d4; margin-top:64px; }
.footer-divider{ border:none; border-top:2px dashed var(--cyan); opacity:.5; margin:0; }
.footer-inner{
  max-width:var(--maxw); margin:0 auto; padding:26px 20px;
  display:flex; flex-wrap:wrap; gap:14px 24px; justify-content:space-between;
  align-items:center; font-size:13px;
}
.footer-inner p{ margin:0; max-width:52ch; }
.footer-inner nav a{ color:#9fe0ff; text-decoration:none; font-weight:700; }
.footer-inner nav a:hover{ text-decoration:underline; }

/* ---------- outlined heading treatment (from the show's on-screen text) ---------- */
.outline-text{

}
.outline-text.on-navy{

  text-shadow:
    -3px -3px 0 #0b1838, 0 -3px 0 #0b1838, 3px -3px 0 #0b1838,

}

/* ---------- page title band (used on inner pages) ---------- */
.page-title-band{

}
.page-title-band h1{ font-size:clamp(28px,5vw,42px); margin:0; }
.page-title-band .subtitle{ color:var(--yellow); font-weight:700; margin-top:8px; font-size:15px; }

/* ---------- hero (home) ---------- */
.hero{

  background:linear-gradient(180deg,#0b1838,#173f72);

.hero-cast-wrap{ position:relative; display:flex; justify-content:center; }
.hero-orbit{
  position:absolute; inset:0; margin:auto;

}
.hero-orbit svg{ width:100%; height:100%; display:block; }
.orbit-spin{ transform-origin:230px 100px; }
@media (prefers-reduced-motion:no-preference){
  .orbit-spin{ animation:spin 110s linear infinite; }
}
@keyframes spin{ to{ transform:rotate(360deg); } }

.hero-inner{ position:relative; z-index:1; max-width:var(--maxw); margin:0 auto; }
.hero-cast{ position:relative; z-index:1; display:flex; align-items:flex-end; justify-content:center; gap:6vw; margin-bottom:6px; }
.char-pro{ width:clamp(84px,16vw,148px); height:auto; }
.char-el{ width:clamp(70px,13vw,120px); height:auto; }
.hero .eyebrow-ru{ color:#9fb6d4; font-weight:700; margin:0 0 4px; font-size:14px; }
.hero h1{ font-size:clamp(36px,7vw,60px); margin:0; letter-spacing:1px; }
.hero .tagline-gold{ color:var(--yellow); font-weight:800; margin:6px 0 0; font-size:clamp(15px,2.4vw,19px); }
.hero .lede{ max-width:58ch; margin:20px auto 26px; font-size:16.5px; color:#dfe9f5; }
.btn-primary{
  display:inline-block; appearance:none; border:none; cursor:pointer;
  background:linear-gradient(180deg,#7fc4f3,#4aa0e6); color:#06101f;
  font-weight:800; font-size:16px; padding:14px 30px; border-radius:12px;
  text-decoration:none; transition:filter .15s;
}
.btn-primary:hover{ filter:brightness(1.07); }

/* ---------- "how it works" arc on home ---------- */
.section{ max-width:var(--maxw); margin:0 auto; padding:52px 20px; }
.section-title{
  text-align:center; font-size:26px; color:var(--headBlue); margin:0 0 28px;
}
.arc-steps{
  list-style:none; margin:0; padding:0; display:flex; align-items:stretch;
  justify-content:center; flex-wrap:wrap; gap:14px 10px;
}
.arc-steps li.arc-step{
  flex:1 1 220px; max-width:280px; background:#fff; border:1px solid #cfe3f4;
  border-radius:14px; padding:18px; text-align:left;
}
.arc-pill{
  display:flex; align-items:center; justify-content:center;
  width:34px; height:34px; border-radius:9px; background:var(--dlg);
  border:2px solid var(--dlgEdge); color:var(--yellow); font-weight:800;
  margin-bottom:10px; font-size:15px;
}
.arc-step h3{ color:var(--headBlue); font-size:17px; margin:0 0 6px; }
.arc-step p{ font-size:14px; margin:0; color:var(--ink); }
.arc-arrow{
  display:flex; align-items:center; justify-content:center;
  color:var(--headBlue); font-size:24px; font-weight:800; flex:0 0 auto;
}
@media (max-width:720px){
  .arc-arrow{ display:none; }
  .arc-steps{ flex-direction:column; align-items:stretch; }
  .arc-steps li.arc-step{ max-width:none; }
}

/* ---------- dialogue box component ---------- */
.dialogue{
  background:var(--dlg); border:2.2px solid var(--dlgEdge); border-radius:14px;
  padding:16px 20px; color:#fff; max-width:62ch;
}
.dialogue + .dialogue{ margin-top:12px; }
.dialogue .who{ font-weight:800; margin-right:8px; }
.dialogue .who.pro{ color:var(--yellow); }
.dialogue .who.el{ color:#8fd0ff; }
.dialogue p{ font-weight:700; margin:0; display:inline; }

.page{ max-width:var(--maxw); margin:0 auto; padding:44px 20px 20px; }

.divider-dashed{ border:none; border-top:2px dashed var(--cyanDk); opacity:.45; margin:40px auto; max-width:65ch; }

.editor-note{
  display:block; font-size:13px; font-style:italic; color:var(--sub);
  border:1.5px dashed var(--ring); padding:10px 16px; border-radius:10px;
  margin:0 auto 30px; max-width:65ch; background:#fff;
}

/* ---------- episode rows ---------- */
.ep-list{ list-style:none; margin:0; padding:0; }
.ep-row{
  display:flex; align-items:center; gap:18px; background:#fff;
  border:1px solid #cfe3f4; border-radius:14px; padding:16px 18px;
}
.ep-list li + li{ margin-top:14px; }
.ep-pill{
  flex:0 0 auto; width:60px; height:60px; border-radius:12px;
  background:var(--dlg); border:2px solid var(--dlgEdge); color:var(--yellow);
  font-weight:800; font-size:14px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; line-height:1.1;
}
.ep-pill .n{ font-size:22px; }
.ep-pill .lbl{ font-size:9px; letter-spacing:.5px; opacity:.85; }
.ep-arrow{ flex:0 0 auto; color:var(--headBlue); font-size:22px; font-weight:800; }
.ep-body{ flex:1 1 260px; min-width:0; }
.ep-title-en{ font-size:18px; font-weight:800; color:var(--headBlue); margin:0; }
.ep-title-ru{ font-size:13px; color:var(--sub); font-style:italic; margin:2px 0 0; }
.ep-premise{ font-size:14.5px; margin:8px 0 0; color:var(--ink); }
.ep-meta{ display:flex; flex-wrap:wrap; gap:8px 10px; margin-top:10px; align-items:center; }
.tag{
  background:#fff; border:2px solid var(--yellow); color:var(--plaqueText);
  font-weight:800; font-size:11px; padding:4px 10px; border-radius:8px;
  letter-spacing:.2px; text-transform:uppercase; white-space:nowrap;
}
.runtime{ font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
.ep-watch{ flex:0 0 auto; }
.btn-watch{
  display:inline-flex; align-items:center; gap:6px;
  background:linear-gradient(180deg,#7fc4f3,#4aa0e6); color:#06101f;
  font-weight:800; padding:10px 18px; border-radius:10px; text-decoration:none;
  font-size:14px; white-space:nowrap;
}
.btn-watch:hover{ filter:brightness(1.06); }

.ep-row.is-soon{ background:#eef6fb; }
.ep-row.is-soon .ep-pill{ background:#e7eef5; color:#8aa0bd; border-color:#c7d6e5; }
.ep-row.is-soon .ep-title-en{ color:#5b6b80; }
.ep-row.is-soon .ep-premise{ color:var(--muted); font-style:italic; }
.soon-label{ font-size:13px; font-weight:800; color:#8aa0bd; }

@media (max-width:600px){
  .ep-row{ flex-wrap:wrap; }
  .ep-arrow{ display:none; }
  .ep-watch{ width:100%; }
  .btn-watch{ width:100%; justify-content:center; }
}

/* ---------- about page bios ---------- */
.bios{ display:flex; flex-wrap:wrap; gap:28px; justify-content:center; margin:30px 0; }
.bio-card{ flex:1 1 260px; max-width:320px; text-align:center; }
.bio-card .portrait{ width:104px; height:auto; margin:0 auto 12px; display:block; }
.bio-card h3{ color:var(--headBlue); font-size:19px; margin:0 0 2px; }
.bio-card .ru{ font-size:13px; color:var(--sub); font-style:italic; margin:0 0 12px; }

/* ---------- watch page ---------- */
.watch-header{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:14px 20px; background:var(--navy1); color:#eef4ff; flex-wrap:wrap;
}
.watch-header .back{ color:#9fe0ff; font-weight:800; text-decoration:none; }
.watch-header .back:hover{ text-decoration:underline; }
.watch-header .ep-name{ font-weight:700; color:#dfe9f5; font-size:14px; }
.watch-frame-wrap{ width:100%; background:#05060c; }
iframe.episode-frame{ display:block; width:100%; height:calc(100vh - 60px); border:none; }
.watch-missing{ padding:70px 20px; text-align:center; }
.watch-missing h1{ color:var(--headBlue); }

@media (max-width:480px){
  iframe.episode-frame{ height:calc(100vh - 96px); }
}

[hidden] { display: none !important; }
</style>
</head>

    <ol class="ep-list">

            <p class="ep-premise">El's tablet keeps her leashed to the wall outlet by its cord — until Pro shows her that energy can leap through open air.</p>

              <span class="runtime">4:22</span>
            </div>
          </div>

        </article>
      </li>

      <li>
        <article class="ep-row">

          <span class="ep-arrow" aria-hidden="true">→</span>

<section class="page">
    <div class="prose">
      <p>WHAT IF?.. (<span lang="ru">«А что если?..»</span>) is a ten-episode animated physics mini-series for kids. Each episode is about four and a half minutes long, stars the same two characters, and runs on the same fixed three-act shape.</p>

      <h2>The three-act format</h2>
      <p>Every episode starts with a problem El can feel — a leash of a cord, a hiding spot that fails, a maze with only one way through. Pro answers it with a real explanation built around one big visual metaphor, never just a definition. And every episode ends with a glimpse of a future where that physics is simply how things work — ordinary, unremarkable, already lived-in.</p>

      <h2>Built by hand, second by second</h2>
      <p>There's no video file behind any episode. Each one is a single self-contained HTML page: a procedurally drawn SVG scene driven by one master clock, storyboarded second-by-second and hand-built in code — every gesture, every line of dialogue, every camera move keyed to an exact timestamp. That's not an implementation detail; it's part of what this project is.</p>

<template id="page-motive">
<div class="page-title-band">
  <h1 class="outline-text on-navy">Why This Show Exists</h1>
</div>
<section class="page">
    <p class="editor-note">The paragraphs below are written in the creator's own voice — an editable placeholder. Replace them with your own reasons; keep the closing line if you'd like, or write a new one.</p>

    <div class="prose">
      <p>Every kid we've ever met asks "what if...?" without being taught to. What if I could fly? What if I were invisible? What if my toy came alive at night? We never really grew out of that question — we just found out that physics is the discipline that takes it seriously instead of changing the subject.</p>

      <p>Everything in this season was real before it was a cartoon: a room that charges your tablet through the air, a cloak that bends light around you, coins of light that catch a spy in the act of looking, a cable held taut by the Earth's own spin. None of it is science fiction. It's science that hasn't finished becoming ordinary yet — the way electricity, or flight, or the phone in your pocket once hadn't.</p>

      <p>We wanted two characters small enough to fit inside an atom and curious enough to ask the annoying questions out loud, so that a proton, an electron, and about four and a half minutes would be enough to make one real piece of physics feel obvious instead of intimidating.</p>

      <p>If a kid finishes an episode and asks, "wait — is that actually true?" — that's the whole show working.</p>

      <p>So here's the only rule this season runs on, the same one every episode starts and ends with: you only need to ask — what if?..</p>
    </div>
  </section>
</template>

\n}\nfunction setLogo(t){\n  let o=0;\n  if(t\u003c6.8){ o=Math.min(win(t,0.6,1.6), 1-win(t,5.7,6.7)); }\n  else if(t>=258.6){ o=win(t,258.8,259.8); }\n  op(logoG,o);\n}\nfunction setFade(t){\n  let o=0;\n  if(t\u003c0.6) o=1-win(t,0,0.6);\n  if(t>260.3) o=Math.max(o, win(t,260.3,262));\n  op(fade,o);\n}\n\nfunction render(t){\n  t=clamp(t,0,TOTAL);\n  setBackgrounds(t);\n  for(const ph of phases){\n    const on = t>=ph.a && t\u003cph.b;\n    vis(ph.o.g, on);\n    if(ph.o.extra) for(const e of ph.o.extra) vis(e,on);\n    if(on) ph.o.update(t);\n  }\n  setHeading(t);\n  setDialogue(t);\n  setLogo(t);\n  setFade(t);\n}\n\n/* ============================================================\n   CLOCK + CONTROLS\n   ============================================================ */\nlet playing=false, cur=0, last=0;\nconst playBtn=document.getElementById(\"play\");\nconst playIcon=document.getElementById(\"playIcon\");\nconst restartBtn=document.getElementById(\"restart\");\nconst scrub=document.getElementById(\"scrub\");\nconst timeEl=document.getElementById(\"time\");\nconst PLAY='M8 5v14l11-7z', PAUSE='M6 5h4v14H6zM14 5h4v14h-4z';\n\nfunction fmt(s){ s=Math.max(0,Math.floor(s)); return Math.floor(s/60)+\":\"+String(s%60).padStart(2,\"0\"); }\nfunction syncUI(){\n  scrub.value=Math.round(cur/TOTAL*1000);\n  timeEl.textContent=fmt(cur)+\" / \"+fmt(TOTAL);\n  playIcon.setAttribute(\"d\", playing?PAUSE:PLAY);\n}\nfunction frame(now){\n  if(playing){\n    if(!last)last=now;\n    cur+=(now-last)/1000; last=now;\n    if(cur>=TOTAL){ cur=TOTAL; playing=false; }\n  }\n  render(cur); syncUI();\n  requestAnimationFrame(frame);\n}\nplayBtn.addEventListener(\"click\",()=>{\n  if(!playing){ if(cur>=TOTAL)cur=0; playing=true; last=0; }\n  else playing=false;\n  syncUI();\n});\nrestartBtn.addEventListener(\"click\",()=>{ cur=0; last=0; render(cur); syncUI(); });\nscrub.addEventListener(\"input\",()=>{ cur=scrub.value/1000*TOTAL; last=0; render(cur); syncUI(); });\n\nrender(0); syncUI();\nrequestAnimationFrame(frame);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"},
  "2": {"title": "Episode 2 — Why Does Energy Get Lost?", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>WHAT IF?.. — Episode 2: Why Does Energy Get Lost?\u003c/title>\n\u003cstyle>\n  :root{\n    --navy1:#0b183b; --navy2:#173f72;\n    --pale1:#dcf2fc; --pale2:#cfeafa;\n    --pro:#f0997b; --proDk:#c66a4f; --proSign:#8a3b28;\n    --el:#85b7eb; --elDk:#4f86c9; --elSign:#274f86;\n    --cyan:#4db7eb; --cyanDk:#378add;\n    --dlg:#0a1733; --dlgEdge:#4db7eb;\n    --yellow:#ffd24a; --headBlue:#214a78; --floor:#9bc4dd;\n  }\n  *{box-sizing:border-box;margin:0;padding:0}\n  html,body{height:100%}\n  body{\n    background:#05060c;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",system-ui,Arial,sans-serif;\n    color:#dfe9f5; display:flex; align-items:center; justify-content:center;\n    min-height:100vh; padding:18px;\n  }\n  .wrap{ width:min(960px,100%); }\n  .frame{\n    position:relative; width:100%; aspect-ratio:854/480;\n    border-radius:14px; overflow:hidden;\n    box-shadow:0 20px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(120,170,230,.18);\n    background:#0b183b;\n  }\n  svg#film{ position:absolute; inset:0; width:100%; height:100%; display:block; }\n  text{ font-family:\"Trebuchet MS\",\"Segoe UI\",system-ui,Arial,sans-serif; }\n\n  /* Controls */\n  .bar{\n    margin-top:12px; display:flex; align-items:center; gap:12px;\n    background:#0d1426; border:1px solid #1f2c47; border-radius:12px;\n    padding:9px 12px;\n  }\n  .btn{\n    appearance:none; border:none; cursor:pointer; color:#06101f;\n    background:linear-gradient(180deg,#7fc4f3,#4aa0e6);\n    font-weight:700; font-size:13px; letter-spacing:.3px;\n    width:42px; height:34px; border-radius:9px; display:flex;\n    align-items:center; justify-content:center; transition:filter .15s;\n    flex:0 0 auto;\n  }\n  .btn:hover{filter:brightness(1.08)}\n  .btn svg{width:16px;height:16px;fill:#06101f}\n  .scrub{ flex:1; appearance:none; height:6px; border-radius:6px; cursor:pointer;\n    background:#22304d; outline:none; }\n  .scrub::-webkit-slider-thumb{ appearance:none; width:15px;height:15px;border-radius:50%;\n    background:#86c8f6; border:2px solid #0d1426; cursor:pointer; box-shadow:0 0 0 1px #4aa0e6;}\n  .scrub::-moz-range-thumb{ width:13px;height:13px;border-radius:50%; background:#86c8f6;\n    border:2px solid #0d1426; cursor:pointer;}\n  .time{ font-variant-numeric:tabular-nums; font-size:12.5px; color:#9fb6d4; min-width:84px; text-align:right;}\n  .hint{ margin-top:9px; font-size:12px; color:#6f819e; text-align:center; }\n  .hint b{color:#9fb6d4;font-weight:600}\n  @media (max-width:520px){ .time{min-width:70px;font-size:11px} }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cdiv class=\"wrap\">\n    \u003cdiv class=\"frame\">\n      \u003csvg id=\"film\" viewBox=\"0 0 854 480\" preserveAspectRatio=\"xMidYMid slice\" aria-label=\"Animated physics episode\">\u003c/svg>\n    \u003c/div>\n    \u003cdiv class=\"bar\">\n      \u003cbutton class=\"btn\" id=\"play\" aria-label=\"Play / pause\">\n        \u003csvg id=\"playIcon\" viewBox=\"0 0 24 24\">\u003cpath d=\"M8 5v14l11-7z\"/>\u003c/svg>\n      \u003c/button>\n      \u003cbutton class=\"btn\" id=\"restart\" aria-label=\"Restart\" title=\"Restart\">\n        \u003csvg viewBox=\"0 0 24 24\">\u003cpath d=\"M12 5V2L7 7l5 5V8a5 5 0 1 1-5 5H5a7 7 0 1 0 7-8z\"/>\u003c/svg>\n      \u003c/button>\n      \u003cinput class=\"scrub\" id=\"scrub\" type=\"range\" min=\"0\" max=\"1000\" value=\"0\" step=\"1\" aria-label=\"Timeline\">\n      \u003cspan class=\"time\" id=\"time\">0:00 / 0:00\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"hint\">Press \u003cb>play\u003c/b> to watch. Drag the timeline to scrub any moment. — \u003cb>WHAT IF?..\u003c/b> · Episode 2\u003c/div>\n  \u003c/div>\n\n\u003cscript>\n\"use strict\";\n/* ============================================================\n   WHAT IF?.. — Episode 2: \"Why Does Energy Get Lost?\"\n   A self-contained, scrubbable animation matching Episode 1's\n   clean educational-slide style. Everything is driven from one\n   master clock `T` (seconds); elements are positioned procedurally.\n   ============================================================ */\nconst SVGNS=\"http://www.w3.org/2000/svg\";\nconst film=document.getElementById(\"film\");\nconst W=854,H=480;\nconst TOTAL=259; // seconds\n\n/* ---------- tiny helpers ---------- */\nfunction S(tag,attrs,parent){\n  const e=document.createElementNS(SVGNS,tag);\n  if(attrs)for(const k in attrs){\n    if(k===\"text\"){e.textContent=attrs[k];}\n    else e.setAttribute(k,attrs[k]);\n  }\n  if(parent)parent.appendChild(e);\n  return e;\n}\nconst clamp=(v,a,b)=>v\u003ca?a:v>b?b:v;\nconst lerp=(a,b,p)=>a+(b-a)*p;\n// smootherstep easing\nconst ease=p=>{p=clamp(p,0,1);return p*p*p*(p*(p*6-15)+10);};\nconst easeOut=p=>{p=clamp(p,0,1);return 1-(1-p)*(1-p);};\nconst easeIn=p=>{p=clamp(p,0,1);return p*p;};\n// progress of t within [a,b], 0..1 clamped\nconst win=(t,a,b)=>clamp((t-a)/(b-a),0,1);\n// raw, unclamped\nconst seg=(t,a,b)=>(t-a)/(b-a);\nfunction vis(el,on){ el.style.display=on?\"\":\"none\"; }\nfunction op(el,o){ el.setAttribute(\"opacity\",clamp(o,0,1)); }\nfunction tf(el,x,y,s,rot){\n  let t=`translate(${x.toFixed(2)} ${y.toFixed(2)})`;\n  if(rot)t+=` rotate(${rot.toFixed(2)})`;\n  if(s!=null&&s!==1)t+=` scale(${s.toFixed(3)})`;\n  el.setAttribute(\"transform\",t);\n}\n// seeded PRNG (mulberry32)\nfunction prng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}\n\n/* ============================================================\n   LAYERS\n   ============================================================ */\nconst defs=S(\"defs\",null,film);\n// space gradient\nlet g=S(\"linearGradient\",{id:\"gSpace\",x1:0,y1:0,x2:0,y2:1},defs);\nS(\"stop\",{offset:0,\"stop-color\":\"#0b1838\"},g);\nS(\"stop\",{offset:1,\"stop-color\":\"#173f72\"},g);\n// pale explain gradient\ng=S(\"linearGradient\",{id:\"gPale\",x1:0,y1:0,x2:0,y2:1},defs);\nS(\"stop\",{offset:0,\"stop-color\":\"#e3f4fd\"},g);\nS(\"stop\",{offset:1,\"stop-color\":\"#cbe8f9\"},g);\n// lamp glow\nlet rg=S(\"radialGradient\",{id:\"gGlow\"},defs);\nS(\"stop\",{offset:0,\"stop-color\":\"#fff4c2\",\"stop-opacity\":.95},rg);\nS(\"stop\",{offset:1,\"stop-color\":\"#fff4c2\",\"stop-opacity\":0},rg);\n// cold glow (super / maglev)\nrg=S(\"radialGradient\",{id:\"gCold\"},defs);\nS(\"stop\",{offset:0,\"stop-color\":\"#bfe9ff\",\"stop-opacity\":.9},rg);\nS(\"stop\",{offset:1,\"stop-color\":\"#bfe9ff\",\"stop-opacity\":0},rg);\n\n// Background layers\nconst bgSpace=S(\"g\",{id:\"bgSpace\"},film);\nS(\"rect\",{x:0,y:0,width:W,height:H,fill:\"url(#gSpace)\"},bgSpace);\nconst bgPale=S(\"g\",{id:\"bgPale\"},film);\nS(\"rect\",{x:0,y:0,width:W,height:H,fill:\"url(#gPale)\"},bgPale);\nS(\"line\",{x1:0,y1:312,x2:W,y2:312,stroke:\"#9bc4dd\",\"stroke-width\":2,opacity:.7},bgPale);\n\n// stars\n(function(){const r=prng(7);for(let i=0;i\u003c78;i++){\n  const x=r()*W,y=r()*H,rad=r()*1.5+0.6,o=r()*0.6+0.35;\n  S(\"circle\",{cx:x.toFixed(1),cy:y.toFixed(1),r:rad.toFixed(2),fill:\"#dceaff\",opacity:o.toFixed(2)},bgSpace);\n}})();\n// pale-bg dotted top border (like ep1 explain scenes)\n(function(){const r=prng(21);for(let i=0;i\u003c34;i++){\n  const x=10+i*25+ (r()*8-4), y=18+Math.sin(i*0.7)*10 + r()*8;\n  S(\"circle\",{cx:x.toFixed(1),cy:y.toFixed(1),r:(r()*1.6+1).toFixed(2),fill:\"#5ea3d4\",opacity:.55},bgPale);\n}})();\n\n// Scene container (each phase builds its own group here)\nconst stage=S(\"g\",{id:\"stage\"},film);\n\n// Characters layer (above scene diagrams, below dialogue)\nconst charLayer=S(\"g\",{id:\"chars\"},film);\n\n// Heading\nconst headG=S(\"g\",{id:\"heading\"},film);\nconst headText=S(\"text\",{x:W/2,y:74,\"text-anchor\":\"middle\",\"font-size\":27,\n  \"font-weight\":\"700\",\"paint-order\":\"stroke\",stroke:\"#ffffff\",\"stroke-width\":5,\n  \"stroke-linejoin\":\"round\",fill:\"#214a78\"},headG);\nconst headSub=S(\"text\",{x:W/2,y:118,\"text-anchor\":\"middle\",\"font-size\":24,\n  \"font-weight\":\"700\",\"paint-order\":\"stroke\",stroke:\"#0b1838\",\"stroke-width\":4,\n  \"stroke-linejoin\":\"round\",fill:\"#ffffff\"},headG);\n\n// Dialogue box\nconst dlgG=S(\"g\",{id:\"dialog\"},film);\nS(\"rect\",{x:28,y:392,width:798,height:74,rx:14,fill:\"#0a1733\",stroke:\"#4db7eb\",\"stroke-width\":2.2},dlgG);\nconst dlgLabel=S(\"text\",{x:54,y:0,\"font-size\":21,\"font-weight\":\"800\"},dlgG);\nconst dlgLine1=S(\"text\",{x:112,y:0,\"font-size\":21,\"font-weight\":\"700\",fill:\"#ffffff\"},dlgG);\nconst dlgLine2=S(\"text\",{x:112,y:0,\"font-size\":21,\"font-weight\":\"700\",fill:\"#ffffff\"},dlgG);\n\n// Logo overlay (title card / end card)\nconst logoG=S(\"g\",{id:\"logo\"},film);\nconst logoTitle=S(\"text\",{x:W/2,y:196,\"text-anchor\":\"middle\",\"font-size\":58,\n  \"font-weight\":\"800\",\"paint-order\":\"stroke\",stroke:\"#0b1838\",\"stroke-width\":6,\n  \"stroke-linejoin\":\"round\",fill:\"#eef4ff\",\"letter-spacing\":2},logoG);\nlogoTitle.textContent=\"WHAT IF?..\";\nconst logoSub=S(\"text\",{x:W/2,y:246,\"text-anchor\":\"middle\",\"font-size\":24,\n  \"font-weight\":\"700\",\"paint-order\":\"stroke\",stroke:\"#0b1838\",\"stroke-width\":3.5,\n  \"stroke-linejoin\":\"round\",fill:\"#ffe7a8\"},logoG);\nlogoSub.textContent=\"Future Physics in 6 Minutes\";\n\n// Fade-to-black overlay\nconst fade=S(\"rect\",{x:0,y:0,width:W,height:H,fill:\"#05060c\",opacity:0},film);\n\n/* ============================================================\n   CHARACTERS\n   ============================================================ */\nfunction makeChar(kind){\n  const isPro=kind===\"pro\";\n  const R=isPro?46:33;\n  const col=isPro?\"#f0997b\":\"#85b7eb\";\n  const dk =isPro?\"#c66a4f\":\"#4f86c9\";\n  const sign=isPro?\"#8a3b28\":\"#274f86\";\n  const g=S(\"g\",{},charLayer);\n  S(\"ellipse\",{cx:0,cy:R*0.98,rx:R*0.92,ry:R*0.2,fill:\"#0b1838\",\"fill-opacity\":.18},g);\n  // arms\n  S(\"path\",{d:`M ${-R+4} 3 q -10 0 -13 6`,stroke:dk,\"stroke-width\":5,fill:\"none\",\"stroke-linecap\":\"round\"},g);\n  S(\"path\",{d:`M ${R-4} 3 q 10 0 13 6`,stroke:dk,\"stroke-width\":5,fill:\"none\",\"stroke-linecap\":\"round\"},g);\n  // body\n  S(\"circle\",{cx:0,cy:0,r:R,fill:col,stroke:dk,\"stroke-width\":3},g);\n  // sign\n  if(isPro){\n    S(\"rect\",{x:-9,y:-R*0.55-2,width:18,height:4.4,rx:1.5,fill:sign},g);\n    S(\"rect\",{x:-2.2,y:-R*0.55-9,width:4.4,height:18,rx:1.5,fill:sign},g);\n  }else{\n    S(\"rect\",{x:-9,y:-R*0.55-2,width:18,height:4.4,rx:1.5,fill:sign},g);\n  }\n  // eyes (open)\n  const eyeY=-R*0.04, eyeX=R*0.31;\n  const eL=S(\"ellipse\",{cx:-eyeX,cy:eyeY,rx:3.1,ry:3.7,fill:\"#1d2a3a\"},g);\n  const eR=S(\"ellipse\",{cx: eyeX,cy:eyeY,rx:3.1,ry:3.7,fill:\"#1d2a3a\"},g);\n  S(\"circle\",{cx:-eyeX-1,cy:eyeY-1.3,r:1,fill:\"#fff\",\"fill-opacity\":.85},g);\n  S(\"circle\",{cx: eyeX-1,cy:eyeY-1.3,r:1,fill:\"#fff\",\"fill-opacity\":.85},g);\n  // tired eyes (lines) hidden\n  const tL=S(\"rect\",{x:-eyeX-5,y:eyeY-1.2,width:10,height:2.6,rx:1.3,fill:\"#1d2a3a\",display:\"none\"},g);\n  const tR=S(\"rect\",{x: eyeX-5,y:eyeY-1.2,width:10,height:2.6,rx:1.3,fill:\"#1d2a3a\",display:\"none\"},g);\n  // mouth\n  const mouth=S(\"path\",{d:\"\",stroke:\"#1d2a3a\",\"stroke-width\":3,fill:\"none\",\"stroke-linecap\":\"round\"},g);\n\n  const M={\n    happy:    `M ${-R*0.26} ${R*0.20} Q 0 ${R*0.46} ${R*0.26} ${R*0.20}`,\n    neutral:  `M ${-R*0.20} ${R*0.30} Q 0 ${R*0.37} ${R*0.20} ${R*0.30}`,\n    tired:    `M ${-R*0.22} ${R*0.36} Q 0 ${R*0.20} ${R*0.22} ${R*0.36}`,\n  };\n  function expr(name){\n    let tired=false, open=false, oh=false;\n    if(name===\"tired\")tired=true;\n    if(name===\"excited\")open=true;\n    if(name===\"surprised\")oh=true;\n    tL.style.display=tired?\"\":\"none\"; tR.style.display=tired?\"\":\"none\";\n    eL.style.display=tired?\"none\":\"\"; eR.style.display=tired?\"none\":\"\";\n    if(open){\n      mouth.setAttribute(\"fill\",\"#1d2a3a\");\n      mouth.setAttribute(\"d\",`M ${-R*0.28} ${R*0.16} Q 0 ${R*0.30} ${R*0.28} ${R*0.16} Q 0 ${R*0.56} ${-R*0.28} ${R*0.16} Z`);\n    }else if(oh){\n      mouth.setAttribute(\"fill\",\"#1d2a3a\");\n      mouth.setAttribute(\"d\",`M -5 ${R*0.30} a 5 6 0 1 0 10 0 a 5 6 0 1 0 -10 0`);\n    }else{\n      mouth.setAttribute(\"fill\",\"none\");\n      mouth.setAttribute(\"d\",M[name]||M.happy);\n    }\n  }\n  expr(\"happy\");\n  return {\n    g,\n    set(x,y,s,name,rot){ tf(g,x,y,s==null?1:s,rot||0); if(name)expr(name); g.style.display=\"\"; g.style.opacity=\"1\"; },\n    hide(){ g.style.display=\"none\"; }\n  };\n}\nconst pro=makeChar(\"pro\");\nconst el =makeChar(\"el\");\nfunction bob(t,amp,spd,ph){ return Math.sin(t*spd+(ph||0))*amp; }\n\n/* small reusable: heat/spark dot pool not needed — drawn per phase */\n\n/* ============================================================\n   PHASE BUILDERS  (each returns {g, update(t)})\n   ============================================================ */\n\n/* ---- PHASE 1 : opening in space ---- */\nfunction buildP1(){\n  const g=S(\"g\",{},stage);\n  const ocx=520, ocy=252, orx=150, ory=70;\n  S(\"ellipse\",{cx:ocx,cy:ocy,rx:orx,ry:ory,fill:\"none\",stroke:\"#4db7eb\",\"stroke-width\":2.2,\n    \"stroke-dasharray\":\"3 7\",\"stroke-linecap\":\"round\",opacity:.85},g);\n  const trail=S(\"path\",{d:\"\",fill:\"none\",stroke:\"#7fcdf6\",\"stroke-width\":3,\"stroke-linecap\":\"round\",opacity:.8},g);\n  return {g,update(t){\n    // chars hidden during pure title card\n    if(t\u003c7){ pro.hide(); el.hide(); g.setAttribute(\"opacity\",0); return; }\n    const intro=easeOut(win(t,7,9.2));\n    g.setAttribute(\"opacity\", lerp(0,1,intro)*(1-win(t,26.5,29.5)));\n    // El orbiting\n    const ang=t*0.95;\n    const ex=ocx+Math.cos(ang)*orx, ey=ocy+Math.sin(ang)*ory;\n    // dashed trail arc behind El\n    const a0=ang-1.7;\n    const p1x=ocx+Math.cos(a0)*orx, p1y=ocy+Math.sin(a0)*ory;\n    trail.setAttribute(\"d\",`M ${p1x.toFixed(1)} ${p1y.toFixed(1)} A ${orx} ${ory} 0 0 1 ${ex.toFixed(1)} ${ey.toFixed(1)}`);\n    trail.setAttribute(\"stroke-dasharray\",\"2 6\");\n    // exit handoff to explain layout (26.5 -> 30)\n    const out=ease(win(t,26.5,30));\n    const proX=lerp(300,120,out), proY=lerp(252,360,out)+bob(t,4,1.7);\n    const proS=lerp(1.0,0.82,out);\n    const elX=lerp(ex,150,out), elY=lerp(ey,250,out);\n    const elS=lerp(0.92,0.8,out);\n    pro.set(proX,proY,proS,\"happy\");\n    el.set(elX,elY,elS, out>0.5?\"happy\":\"excited\");\n  }};\n}\n\n/* ---- PHASE 2 : energy gets lost ---- */\nfunction buildP2(){\n  const g=S(\"g\",{},stage);\n  const x0=150,x1=700,y=250;\n  // source box (left)\n  const src=S(\"g\",{},g);\n  S(\"rect\",{x:78,y:222,width:62,height:56,rx:10,fill:\"#ffffff\",stroke:\"#4db7eb\",\"stroke-width\":2.4},src);\n  S(\"circle\",{cx:100,cy:258,r:3.4,fill:\"#274f86\"},src);\n  S(\"circle\",{cx:118,cy:258,r:3.4,fill:\"#274f86\"},src);\n  S(\"text\",{x:109,y:242,\"text-anchor\":\"middle\",\"font-size\":13,\"font-weight\":\"700\",fill:\"#214a78\",text:\"source\"},src);\n  // wire\n  S(\"line\",{x1:x0,y1:y,x2:x1,y2:y,stroke:\"#9fb6cf\",\"stroke-width\":7,\"stroke-linecap\":\"round\"},g);\n  S(\"line\",{x1:x0,y1:y,x2:x1,y2:y,stroke:\"#3c6599\",\"stroke-width\":3,\"stroke-linecap\":\"round\"},g);\n  // lamp at end\n  const lampX=752;\n  const glow=S(\"circle\",{cx:lampX,cy:y-6,r:40,fill:\"url(#gGlow)\",opacity:0},g);\n  S(\"path\",{d:`M ${lampX-16} ${y+8} q 16 -52 32 0 z`,fill:\"#ffe9a8\",stroke:\"#d9a93b\",\"stroke-width\":2},g);\n  const bulb=S(\"circle\",{cx:lampX,cy:y-9,r:15,fill:\"#fff3bf\",stroke:\"#d9a93b\",\"stroke-width\":2},g);\n  S(\"rect\",{x:lampX-8,y:y+8,width:16,height:9,rx:2,fill:\"#7c8aa0\"},g);\n  // heat label\n  const heatLbl=S(\"g\",{opacity:0},g);\n  S(\"rect\",{x:392,y:188,width:84,height:26,rx:7,fill ibute(\"cx\",(200+i*68+jig).toFixed(1));\n      atoms[i].setAttribute(\"fill\", cool>0.5? \"#bfe3f7\":\"#9ec7e6\");\n    }\n    // El glides straight, keeps sparks\n    const rp=ease(win(t,150,170));\n    const elx=lerp(170,665,rp);\n    const ely=yc-2+bob(t,2.4,3);\n    el.set(elx,ely,0.78, rp>0.05?\"excited\":\"happy\");\n    for(const sp of sparks){\n      const a=sp.ang+t*2.6;\n      sp.el.setAttribute(\"cx\",(elx+Math.cos(a)*sp.rad).toFixed(1));\n      sp.el.setAttribute(\"cy\",(ely+Math.sin(a)*sp.rad-2).toFixed(1));\n    }\n  }};\n}\n\n/* ---- PHASE 5 : maglev train ---- */\nfunction buildP5(){\n  const g=S(\"g\",{},stage);\n  const trackY=312;\n  // buildings (appear later)\n  const city=S(\"g\",{opacity:0},g);\n  function bldg(bx,bw,bh){\n    const b=S(\"g\",{},city);\n    S(\"rect\",{x:bx,y:trackY-bh,width:bw,height:bh,rx:4,fill:\"#bcdcf2\",stroke:\"#7fb0d8\",\"stroke-width\":2},b);\n    const win=[];\n    for(let r2=0;r2\u003cMath.floor(bh/26);r2++)for(let c=0;c\u003cMath.floor(bw/24);c++){\n      win.push(S(\"rect\",{x:bx+10+c*24,y:trackY-bh+12+r2*26,width:12,height:14,rx:2,fill:\"#7fa8c8\"},b));\n    }\n    return win;\n  }\n  const winA=bldg(70,70,120), winB=bldg(150,54,84), winC=bldg(690,80,140), winD=bldg(782,46,96);\n  const allWin=[...winA,...winB,...winC,...winD];\n  // street lamps\n  const lamps=[];\n  [300,560].forEach(lx=>{\n    const lg=S(\"g\",{},city);\n    S(\"rect\",{x:lx-2,y:trackY-70,width:4,height:70,fill:\"#7c8aa0\"},lg);\n    const gl=S(\"circle\",{cx:lx,cy:trackY-74,r:26,fill:\"url(#gGlow)\",opacity:0},lg);\n    S(\"circle\",{cx:lx,cy:trackY-74,r:8,fill:\"#fff3bf\",stroke:\"#d9a93b\",\"stroke-width\":2},lg);\n    lamps.push(gl);\n  });\n  // track\n  S(\"line\",{x1:30,y1:trackY,x2:824,y2:trackY,stroke:\"#5d8fbf\",\"stroke-width\":4,\"stroke-linecap\":\"round\"},g);\n  const ties=S(\"g\",{},g);\n  for(let x=40;x\u003c820;x+=34) S(\"rect\",{x:x,y:trackY+3,width:6,height:10,rx:2,fill:\"#8fb2d2\"},ties);\n  // field arcs under train\n  c 5? \"#ffe9a8\":\"#7fa8c8\");\n  }};\n}\n\n/* ---- PHASE 6 : recap + ending ---- */\nfunction buildP6(){\n  const g=S(\"g\",{},stage);\n  const x0=150,x1=700,yc=250;\n  // blue superconductor wire + lamp (race)\n  const race=S(\"g\",{},g);\n  S(\"line\",{x1:x0,y1:yc,x2:x1,y2:yc,stroke:\"#7fc7f0\",\"stroke-width\":7,\"stroke-linecap\":\"round\"},race);\n  S(\"line\",{x1:x0,y1:yc,x2:x1,y2:yc,stroke:\"#3aa0e0\",\"stroke-width\":3,\"stroke-linecap\":\"round\"},race);\n  S(\"circle\",{cx:(x0+x1)/2,cy:yc,r:120,fill:\"url(#gCold)\",opacity:.5},race);\n  const lampX=752;\n  const glow=S(\"circle\",{cx:lampX,cy:yc-6,r:46,fill:\"url(#gGlow)\",opacity:0},race);\n  S(\"path\",{d:`M ${lampX-16} ${yc+8} q 16 -52 32 0 z`,fill:\"#ffe9a8\",stroke:\"#d9a93b\",\"stroke-width\":2},race);\n  const bulb=S(\"circle\",{cx:lampX,cy:yc-9,r:15,fill:\"#fff3bf\",stroke:\"#d9a93b\",\"stroke-width\":2},race);\n  S(\"rect\",{x:lampX-8,y:yc+8,width:16,height:9,rx:2,fill:\"#7c8aa0\"},race);\n  const sparks=[]; const r=prng(3);\n  for(let i=0;i\u003c7;i++) sparks.push({el:S(\"circle\",{cx:0,cy:0,r:3.3,fill:\"#ffd54a\"},race),ang:r()*6.28,rad:13+r()*7});\n\n  // recap diagram\n  const recap=S(\"g\",{opacity:0},g);\n  function row(ry,a,b,heat){\n    const rg=S(\"g\",{},recap);\n    S(\"rect\",{x:150,y:ry-26,width:150,height:52,rx:10,fill:\"#0a1733\",stroke:\"#4db7eb\",\"stroke-width\":2},rg);\n    S(\"text\",{x:225,y:ry+6,\"text-anchor\":\"middle\",\"font-size\":(a.length>10?15:18),\"font-weight\":\"800\",fill:\"#ffd24a\",text:a},rg);\n    S(\"path\",{d:`M 312 ${ry} L 360 ${ry}`,stroke:\"#214a78\",\"stroke-width\":4,\"marker\":\"\"},rg);\n    S(\"path\",{d:`M 352 ${ry-7} L 366 ${ry} L 352 ${ry+7} Z`,fill:\"#214a78\"},rg);\n    S(\"text\",{x:384,y:ry+6,\"font-size\":18,\"font-weight\":\"700\",fill:\"#214a78\",text:b},rg);\n    if(heat){\n      S(\"path\",{d:`M 662 ${ry-13} q 8 8 2 15 q 6 -2 5 -9 q 5 5 1 12 q -2 5 -8 5 q -8 0 -8 -8 q 0 -7 8 -11 z`,fill:\"#ff7a33\",stroke:\"#e2641f\",\"stroke-width\":1.2,\"stroke-linejoin\":\"round\"},rg);\n    }else{\n      S(\"circle\",{cx:662,cy:ry,r:11,fill:\"#3bbf6a\"},rg);\n      S(\"path\",{d:`M 656 ${ry} l 4 5 l 8 -9`,stroke:\"#fff\",\"stroke-width\":2.6,fill:\"none\",\"stroke-linecap\":\"round\",\"stroke-linejoin\":\"round\"},rg);\n    }\n    return rg;\n  }\n  const rowA=row(196,\"Resistance\",\"energy turns to heat\",true);\n  const rowB=row(286,\"Superconductor\",\"almost nothing lost\",false);\n\n  return {g,update(t){\n    // race 221-234\n    const racing = t\u003c235;\n    op(race, racing?1:(1-win(t,234,236)));\n    if(racing){\n      const rp=ease(win(t,222,233));\n      const elx=lerp(x0,690,rp), ely=yc-2+bob(t,3,4);\n      el.set(elx,ely,0.78,\"excited\");\n      for(const sp of sparks){const a=sp.ang+t*2.6;\n        sp.el.setAttribute(\"cx\",(elx+Math.cos(a)*sp.rad).toFixed(1));\n        sp.el.setAttribute(\"cy\",(ely+Math.sin(a)*sp.rad-2).toFixed(1)); op(sp.el,1);}\n      op(glow, rp); bulb.setAttribute(\"fill\", rp>0.1?\"#fff6c8\":\"#fff3bf\");\n      pro.set(120,362+bob(t,3,1.6),0.8,\"happy\");\n    }\n    // recap 235-247\n    op(recap, win(t,235.5,238)*(1-win(t,246.5,248.5)));\n    if(t>=235 && t\u003c248){\n      const rgA=rowA, rgB=rowB;\n      op(rgA, win(t,236,238)); op(rgB, win(t,242.5,244.5));\n      pro.set(112,362+bob(t,3,1.6),0.8,\"happy\");\n      el.set(742,362+bob(t,3,1.7,1),0.78,\"happy\");\n    }\n    // space teaser 248-259 (chars centered, look at camera, then wave)\n    if(t>=248){\n      op(recap,0); op(race,0);\n      const wave = t>254 ? Math.sin(t*7)*10 : 0;\n      pro.set(330,300+bob(t,4,1.8),0.92,\"happy\", wave);\n      el.set(540,308+bob(t,4,2),0.86,\"excited\", -wave);\n    }\n  }};\n}\n\nconst P1=buildP1(),P2=buildP2(),P3=buildP3(),P4=buildP4(),P5=buildP5(),P6=buildP6();\nconst phases=[\n  {a:0,  b:30, o:P1},\n  {a:30, b:76, o:P2},\n  {a:76, b:131,o:P3},\n  {a:131,b:176,o:P4},\n  {a:176,b:221,o:P5},\n  {a:221,b:259,o:P6},\n];\n\n/* ============================================================\n   SCHEDULES\n   ============================================================ */\nconst headings=[\n  {a:8,  b:27,  text:\"Episode 2 — Why Does Energy Get Lost?\", style:\"space\"},\n  {a:31, b:75.5,text:\"Energy on the move\",                    style:\"explain\"},\n  {a:77, b:130.5,text:\"What slows energy down?\",              style:\"explain\"},\n  {a:132,b:175.5,text:\"Cool it down\",                         style:\"explain\"},\n  {a:178,b:220.5,text:\"Energy with no losses\",                style:\"explain\"},\n  {a:222,b:234.5,text:\"So — why does energy get lost?\",       style:\"explain\"},\n  {a:235.5,b:247,text:\"Quick recap\",                          style:\"explain\"},\n  {a:249,b:255, text:\"What if no energy were ever lost again?\",style:\"space\"},\n];\n\nconst lines=[\n  [\"EL\",9,13.5,[\"Last time, we sent energy down a wire —\",\"all the way to the tablet!\"]],\n  [\"PRO\",14,19,[\"Right — but not all of it arrived.\",\"Some got lost on the way.\"]],\n  [\"EL\",19.5,23.8,[\"Lost?! Where does energy even go?\"]],\n  [\"PRO\",24.3,29.4,[\"Let me show you. Follow the wire...\"]],\n\n  [\"EL\",31.5,36.2,[\"Watch me carry the energy to the lamp!\"]],\n  [\"EL\",49,55,[\"Hey... why am I running low on sparks?!\"]],\n  [\"PRO\",57.5,64,[\"The energy didn't vanish —\",\"it turned into heat along the way.\"]],\n  [\"PRO\",65.5,73.5,[\"So only about half reached the lamp.\"]],\n\n  [\"PRO\",78,84,[\"Look inside the wire — it's packed with atoms.\"]],\n  [\"PRO\",86.5,93,[\"El can't help bumping into them,\",\"again and again.\"]],\n  [\"PRO\",100,108,[\"Every bump sheds a spark as heat.\",\"That's electrical resistance.\"]],\n  [\"EL\",114,123,[\"So an ordinary wire is a\",\"leaky bucket for energy!\"]],\n\n  [\"PRO\",134,140.5,[\"Now chill the right material\",\"past its critical temperature...\"]],\n  [\"PRO\",143,150,[\"...and the atoms settle into a clear lane.\"]],\n  [\"PRO\",153.5,161,[\"Resistance drops to zero.\",\"That's a superconductor.\"]],\n  [\"EL\",164.5,171.5,[\"I glided straight through —\",\"not one spark lost!\"]],\n\n  [\"PRO\",179,186.5,[\"No resistance means no waste —\",\"enough, even, to lift a whole train.\"]],\n  [\"EL\",194,200.5,[\"It's floating! No friction,\",\"no energy lost!\"]],\n  [\"PRO\",206,213,[\"And every lamp in town\",\"glows evenly and bright.\"]],\n  [\"PRO\",214,220,[\"When nothing is lost,\",\"there's light enough for everyone.\"]],\n\n  [\"EL\",225,233,[\"This time... every single spark made it!\"]],\n  [\"PRO\",237,242,[\"Resistance turns energy into heat.\"]],\n  [\"PRO\",243,248,[\"A superconductor has almost none —\",\"so it all arrives.\"]],\n  [\"EL\",253.5,258,[\"Next time: a hologram you can touch!\"]],\n];\n\n/* ============================================================\n   RENDER\n   ============================================================ */\nfunction setBackgrounds(t){\n  let spaceOp;\n  if(t\u003c27) spaceOp=1;\n  else if(t\u003c30) spaceOp=1-win(t,27,30);\n  else if(t\u003c247) spaceOp=0;\n  else spaceOp=win(t,247,250);\n  op(bgSpace,spaceOp);\n  op(bgPale, clamp(1-spaceOp,0,1));\n}\nfunction setHeading(t){\n  let cur=null;\n  for(const h of headings) if(t>=h.a&&t\u003c=h.b){cur=h;break;}\n  if(!cur){ op(headG,0); return; }\n  const fin = Math.min(win(t,cur.a,cur.a+0.6), 1-win(t,cur.b-0.6,cur.b));\n  op(headG, fin);\n  headText.textContent=cur.text;\n  headSub.textContent=\"\";\n  if(cur.style===\"space\"){ headText.setAttribute(\"fill\",\"#ffd24a\"); headText.setAttribute(\"stroke\",\"#0b1838\"); }\n  else { headText.setAttribute(\"fill\",\"#214a78\"); headText.setAttribute(\"stroke\",\"#ffffff\"); }\n}\nfunction setDialogue(t){\n  let cur=null;\n  for(const l of lines) if(t>=l[1]&&t\u003c=l[2]){cur=l;}\n  if(!cur){ op(dlgG,0); return; }\n  op(dlgG,1);\n  const who=cur[0], txt=cur[3];\n  dlgLabel.textContent=who+\":\";\n  dlgLabel.setAttribute(\"fill\", who===\"PRO\"?\"#ffd24a\":\"#8fd0ff\");\n  if(txt.length>1){\n    dlgLabel.setAttribute(\"y\",424);\n    dlgLine1.setAttribute(\"y\",424); dlgLine1.textContent=txt[0];\n    dlgLine2.setAttribute(\"y\",451); dlgLine2.textContent=txt[1]; op(dlgLine2,1);\n  }else{\n    dlgLabel.setAttribute(\"y\",437);\n    dlgLine1.setAttribute(\"y\",437); dlgLine1.textContent=txt[0];\n    dlgLine2.textContent=\"\"; op(dlgLine2,0);\n  }\n}\nfunction setLogo(t){\n  let o=0;\n  if(t\u003c6.8){ o=Math.min(win(t,0.6,1.6), 1-win(t,5.7,6.7)); }\n  else if(t>=254.6){ o=win(t,254.8,255.8); }\n  op(logoG,o);\n}\nfunction setFade(t){\n  let o=0;\n  if(t\u003c0.6) o=1-win(t,0,0.6);\n  if(t>257.5) o=Math.max(o, win(t,257.5,259));\n  op(fade,o);\n}\n\nfunction render(t){\n  t=clamp(t,0,TOTAL);\n  setBackgrounds(t);\n  // phases: show active, hide others\n  for(const ph of phases){\n    const on = t>=ph.a && t\u003cph.b;\n    vis(ph.o.g, on);\n    if(on) ph.o.update(t);\n  }\n  // ensure chars not left visible from an inactive phase: each active phase sets them.\n  setHeading(t);\n  setDialogue(t);\n  setLogo(t);\n  setFade(t);\n}\n\n/* ============================================================\n   CLOCK + CONTROLS\n   ============================================================ */\nlet playing=false, cur=0, last=0;\nconst playBtn=document.getElementById(\"play\");\nconst playIcon=document.getElementById(\"playIcon\");\nconst restartBtn=document.getElementById(\"restart\");\nconst scrub=document.getElementById(\"scrub\");\nconst timeEl=document.getElementById(\"time\");\nconst PLAY='M8 5v14l11-7z', PAUSE='M6 5h4v14H6zM14 5h4v14h-4z';\n\nfunction fmt(s){ s=Math.max(0,Math.floor(s)); return Math.floor(s/60)+\":\"+String(s%60).padStart(2,\"0\"); }\nfunction syncUI(){\n  scrub.value=Math.round(cur/TOTAL*1000);\n  timeEl.textContent=fmt(cur)+\" / \"+fmt(TOTAL);\n  playIcon.setAttribute(\"d\", playing?PAUSE:PLAY);\n}\nfunction frame(now){\n  if(playing){\n    if(!last)last=now;\n    cur+=(now-last)/1000; last=now;\n    if(cur>=TOTAL){ cur=TOTAL; playing=false; }\n  }\n  render(cur); syncUI();\n  requestAnimationFrame(frame);\n}\nplayBtn.addEventListener(\"click\",()=>{\n  if(!playing){ if(cur>=TOTAL)cur=0; playing=true; last=0; }\n  else playing=false;\n  syncUI();\n});\nrestartBtn.addEventListener(\"click\",()=>{ cur=0; last=0; render(cur); syncUI(); });\nscrub.addEventListener(\"input\",()=>{ cur=scrub.value/1000*TOTAL; last=0; render(cur); syncUI(); });\n\nrender(0); syncUI();\nrequestAnimationFrame(frame);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n\u003c/body>\n\u003c/html>\n"},
  "3": {"title": "Episode 3 — A Hologram You Can Touch", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>WHAT IF?.. — Episode 3: A Hologram You Can Touch\u003c/title>\n\u003cstyle>\n  :root{\n    --navy1:#0b183b; --navy2:#173f72;\n    --pale1:#dcf2fc; --pale2:#cfeafa;\n    --pro:#f0997b; --proDk:#c66a4f; --proSign:#8a3b28;\n    --el:#85b7eb; --elDk:#4f86c9; --elSign:#274f86;\n    --friend:#68c3a6; --friendDk:#3f9d82;\n    --cyan:#4db7eb; --cyanDk:#378add;\n    --dlg:#0a1733; --dlgEdge:#4db7eb;\n    --yellow:#ffd24a; --headBlue:#214a78; --floor:#9bc4dd;\n  }\n  *{box-sizing:border-box;margin:0;padding:0}\n  html,body{height:100%}\n  body{\n    background:#05060c;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",system-ui,Arial,sans-serif;\n    color:#dfe9f5; display:flex; align-items:center; justify-content:center;\n    min-height:100vh; padding:18px;\n  }\n  .wrap{ width:min(960px,100%); }\n  .frame{\n    position:relative; width:100%; aspect-ratio:854/480;\n    border-radius:14px; overflow:hidden;\n    box-shadow:0 20px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(120,170,230,.18);\n    background:#0b183b;\n  }\n  svg#film{ position:absolute; inset:0; width:100%; height:100%; display:block; }\n  text{ font-family:\"Trebuchet MS\",\"Segoe UI\",system-ui,Arial,sans-serif; }\n\n  /* Controls */\n  .bar{\n    margin-top:12px; display:flex; align-items:center; gap:12px;\n    background:#0d1426; border:1px solid #1f2c47; border-radius:12px;\n    padding:9px 12px;\n  }\n  .btn{\n    appearance:none; border:none; cursor:pointer; color:#06101f;\n    background:linear-gradient(180deg,#7fc4f3,#4aa0e6);\n    font-weight:700; font-size:13px; letter-spacing:.3px;\n    width:42px; height:34px; border-radius:9px; display:flex;\n    align-items:center; justify-content:center; transition:filter .15s;\n    flex:0 0 auto;\n  }\n  .btn:hover{filter:brightness(1.08)}\n  .btn svg{width:16px;height:16px;fill:#06101f}\n  .scrub{ flex:1; appearance:none; height:6px; border-radius:6px; cursor:pointer;\n    background:#22304d; outline:none; }\n  .scrub::-webkit-slider-thumb{ appearance:none; width:15px;height:15px;border-radius:50%;\n    background:#86c8f6; border:2px solid #0d1426; cursor:pointer; box-shadow:0 0 0 1px #4aa0e6;}\n  .scrub::-moz-range-thumb{ width:13px;height:13px;border-radius:50%; background:#86c8f6;\n    border:2px solid #0d1426; cursor:pointer;}\n  .time{ font-variant-numeric:tabular-nums; font-size:12.5px; color:#9fb6d4; min-width:84px; text-align:right;}\n  .hint{ margin-top:9px; font-size:12px; color:#6f819e; text-align:center; }\n  .hint b{color:#9fb6d4;font-weight:600}\n  @media (max-width:520px){ .time{min-width:70px;font-size:11px} }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cdiv class=\"wrap\">\n    \u003cdiv class=\"frame\">\n      \u003csvg id=\"film\" viewBox=\"0 0 854 480\" preserveAspectRatio=\"xMidYMid slice\" aria-label=\"Animated physics episode\">\u003c/svg>\n    \u003c/div>\n    \u003cdiv class=\"bar\">\n      \u003cbutton class=\"btn\" id=\"play\" aria-label=\"Play / pause\">\n        \u003csvg id=\"playIcon\" viewBox=\"0 0 24 24\">\u003cpath d=\"M8 5v14l11-7z\"/>\u003c/svg>\n      \u003c/button>\n      \u003cbutton class=\"btn\" id=\"restart\" aria-label=\"Restart\" title=\"Restart\">\n        \u003csvg viewBox=\"0 0 24 24\">\u003cpath d=\"M12 5V2L7 7l5 5V8a5 5 0 1 1-5 5H5a7 7 0 1 0 7-8z\"/>\u003c/svg>\n      \u003c/button>\n      \u003cinput class=\"scrub\" id=\"scrub\" type=\"range\" min=\"0\" max=\"1000\" value=\"0\" step=\"1\" aria-label=\"Timeline\">\n      \u003cspan class=\"time\" id=\"time\">0:00 / 0:00\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"hint\">Press \u003cb>play\u003c/b> to watch. Drag the timeline to scrub any moment. — \u003cb>WHAT IF?..\u003c/b> · Episode 3\u003c/div>\n  \u003c/div>\n\n\u003cscript>\n\"use strict\";\n/* ============================================================\n   WHAT IF?.. — Episode 3: \"A Hologram You Can Touch\"\n   The quiet one. El stays subdued; movements are soft.\n   Physics: focused sound (ultrasonic acoustic haptics) — many\n   emitters aim pressure waves at one point so the skin can feel\n   a shape in mid-air. Same clean slide style as Episodes 1-2,\n   all driven from one master clock `T` (seconds), procedurally.\n   ============================================================ */\nconst SVGNS=\"http://www.w3.org/2000/svg\";\nconst film=document.getElementById(\"film\");\nconst W=854,H=480;\nconst TOTAL=262; // seconds (~4:22)\n\n/* ---------- tiny helpers ---------- */\nfunction S(tag,attrs,parent){\n  const e=document.createElementNS(SVGNS,tag);\n  if(attrs)for(const k in attrs){\n    if(k===\"text\"){e.textContent=attrs[k];}\n    else e.setAttribute(k,attrs[k]);\n  }\n  if(parent)parent.appendChild(e);\n  return e;\n}\nconst clamp=(v,a,b)=>v\u003ca?a:v>b?b:v;\nconst lerp=(a,b,p)=>a+(b-a)*p;\nconst ease=p=>{p=clamp(p,0,1);return p*p*p*(p*(p*6-15)+10);};\nconst easeOut=p=>{p=clamp(p,0,1);return 1-(1-p)*(1-p);};\nconst easeIn=p=>{p=clamp(p,0,1);return p*p;};\nconst win=(t,a,b)=>clamp((t-a)/(b-a),0,1);\nconst seg=(t,a,b)=>(t-a)/(b-a);\nfunction vis(el,on){ el.style.display=on?\"\":\"none\"; }\nfunction op(el,o){ el.setAttribute(\"opacity\",clamp(o,0,1)); }\nfunction tf(el,x,y,s,rot){\n  let t=`translate(${x.toFixed(2)} ${y.toFixed(2)})`;\n  if(rot)t+=` rotate(${rot.toFixed(2)})`;\n  if(s!=null&&s!==1)t+=` scale(${s.toFixed(3)})`;\n  el.setAttribute(\"transform\",t);\n}\nfunction prng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}\n\n/* ============================================================\n   LAYERS\n   ============================================================ */\nconst defs=S(\"defs\",null,film);\nlet g=S(\"linearGradient\",{id:\"gSpace\",x1:0,y1:0,x2:0,y2:1},defs);\nS(\"stop\",{offset:0,\"stop-color\":\"#0b1838\"},g);\nS(\"stop\",{offset:1,\"stop-color\":\"#173f72\"},g);\ng=S(\"linearGradient\",{id:\"gPale\",x1:0,y1:0,x2:0,y2:1},defs);\nS(\"stop\",{offset:0,\"stop-color\":\"#e3f4fd\"},g);\nS(\"stop\",{offset:1,\"stop-color\":\"#cbe8f9\"},g);\n// soft warm room overlay (future scene)\nlet rg=S(\"radialGradient\",{id:\"gWarm\",cx:\"52%\",cy:\"46%\",r:\"62%\"},defs);\nS(\"stop\",{offset:0,\"stop-color\":\"#ffe3c4\",\"stop-opacity\":.55},rg);\nS(\"stop\",{offset:1,\"stop-color\":\"#ffe3c4\",\"stop-opacity\":0},rg);\n// hologram / contact glow\nrg=S(\"radialGradient\",{id:\"gHolo\"},defs);\nS(\"stop\",{offset:0,\"stop-color\":\"#c7f1ff\",\"stop-opacity\":.9},rg);\nS(\"stop\",{offset:1,\"stop-color\":\"#c7f1ff\",\"stop-opacity\":0},rg);\n// small focus node glow\nrg=S(\"radialGradient\",{id:\"gNode\"},defs);\nS(\"stop\",{offset:0,\"stop-color\":\"#eafbff\",\"stop-opacity\":1},rg);\nS(\"stop\",{offset:.55,\"stop-color\":\"#8fe0ff\",\"stop-opacity\":.75},rg);\nS(\"stop\",{offset:1,\"stop-color\":\"#8fe0ff\",\"stop-opacity\":0},rg);\n\n// Background layers\nconst bgSpace=S(\"g\",{id:\"bgSpace\"},film);\nS(\"rect\",{x:0,y:0,width:W,height:H,fill:\"url(#gSpace)\"},bgSpace);\nconst bgPale=S(\"g\",{id:\"bgPale\"},film);\nS(\"rect\",{x:0,y:0,width:W,height:H,fill:\"url(#gPale)\"},bgPale);\nS(\"line\",{x1:0,y1:312,x2:W,y2:312,stroke:\"#9bc4dd\",\"stroke-width\":2,opacity:.7},bgPale);\n\n// stars\n(function(){const r=prng(7);for(let i=0;i\u003c78;i++){\n  const x=r()*W,y=r()*H,rad=r()*1.5+0.6,o=r()*0.6+0.35;\n  S(\"circle\",{cx:x.toFixed(1),cy:y.toFixed(1),r:rad.toFixed(2),fill:\"#dceaff\",opacity:o.toFixed(2)},bgSpace);\n}})();\n// pale-bg dotted top border\n(function(){const r=prng(21);for(let i=0;i\u003c34;i++){\n  const x=10+i*25+ (r()*8-4), y=18+Math.sin(i*0.7)*10 + r()*8;\n  S(\"circle\",{cx:x.toFixed(1),cy:y.toFixed(1),r:(r()*1.6+1).toFixed(2),fill:\"#5ea3d4\",opacity:.55},bgPale);\n}})();\n\n// Scene container\nconst stage=S(\"g\",{id:\"stage\"},film);\n// Characters layer\nconst charLayer=S(\"g\",{id:\"chars\"},film);\n\n// Heading\nconst headG=S(\"g\",{id:\"heading\"},film);\nconst headText=S(\"text\",{x:W/2,y:74,\"text-anchor\":\"middle\",\"font-size\":27,\n  \"font-weight\":\"700\",\"paint-order\":\"stroke\",stroke:\"#ffffff\",\"stroke-width\":5,\n  \"stroke-linejoin\":\"round\",fill:\"#214a78\"},headG);\nconst headSub=S(\"text\",{x:W/2,y:118,\"text-anchor\":\"middle\",\"font-size\":24,\n  \"font-weight\":\"700\",\"paint-order\":\"stroke\",stroke:\"#0b1838\",\"stroke-width\":4,\n  \"stroke-linejoin\":\"round\",fill:\"#ffffff\"},headG);\n\n// Dialogue box\nconst dlgG=S(\"g\",{id:\"dialog\"},film);\nS(\"rect\",{x:28,y:392,width:798,height:74,rx:14,fill:\"#0a1733\",stroke:\"#4db7eb\",\"stroke-width\":2.2},dlgG);\nconst dlgLabel=S(\"text\",{x:54,y:0,\"font-size\":21,\"font-weight\":\"800\"},dlgG);\nconst dlgLine1=S(\"text\",{x:112,y:0,\"font-size\":21,\"font-weight\":\"700\",fill:\"#ffffff\"},dlgG);\nconst dlgLine2=S(\"text\",{x:112,y:0,\"font-size\":21,\"font-weight\":\"700\",fill:\"#ffffff\"},dlgG);\n\n// Logo overlay\nconst logoG=S(\"g\",{id:\"logo\"},film);\nconst logoTitle=S(\"text\",{x:W/2,y:196,\"text-anchor\":\"middle\",\"font-size\":58,\n  \"font-weight\":\"800\",\"paint-order\":\"stroke\",stroke:\"#0b1838\",\"stroke-width\":6,\n  \"stroke-linejoin\":\"round\",fill:\"#eef4ff\",\"letter-spacing\":2},logoG);\nlogoTitle.textContent=\"WHAT IF?..\";\nconst logoSub=S(\"text\",{x:W/2,y:246,\"text-anchor\":\"middle\",\"font-size\":24,\n  \"font-weight\":\"700\",\"paint-order\":\"stroke\",stroke:\"#0b1838\",\"stroke-width\":3.5,\n  \"stroke-linejoin\":\"round\",fill:\"#ffe7a8\"},logoG);\nlogoSub.textContent=\"Future Physics in 6 Minutes\";\n\n// Fade-to-black overlay\nconst fade=S(\"rect\",{x:0,y:0,width:W,height:H,fill:\"#05060c\",opacity:0},film);\n\n/* ============================================================\n   CHARACTERS\n   ============================================================ */\nfunction makeChar(kind){\n  const isPro=kind===\"pro\";\n  const R=isPro?46:33;\n  const col=isPro?\"#f0997b\":\"#85b7eb\";\n  const dk =isPro?\"#c66a4f\":\"#4f86c9\";\n  const sign=isPro?\"#8a3b28\":\"#274f86\";\n  const g=S(\"g\",{},charLayer);\n  S(\"ellipse\",{cx:0,cy:R*0.98,rx:R*0.92,ry:R*0.2,fill:\"#0b1838\",\"fill-opacity\":.18},g);\n  // arms\n  S(\"path\",{d:`M ${-R+4} 3 q -10 0 -13 6`,stroke:dk,\"stroke-width\":5,fill:\"none\",\"stroke-linecap\":\"round\"},g);\n  S(\"path\",{d:`M ${R-4} 3 q 10 0 13 6`,stroke:dk,\"stroke-width\":5,fill:\"none\",\"stroke-linecap\":\"round\"},g);\n  // body\n  S(\"circle\",{cx:0,cy:0,r:R,fill:col,stroke:dk,\"stroke-width\":3},g);\n  // sign\n  if(isPro){\n    S(\"rect\",{x:-9,y:-R*0.55-2,width:18,height:4.4,rx:1.5,fill:sign},g);\n    S(\"rect\",{x:-2.2,y:-R*0.55-9,width:4.4,height:18,rx:1.5,fill:sign},g);\n  }else{\n    S(\"rect\",{x:-9,y:-R*0.55-2,width:18,height:4.4,rx:1.5,fill:sign},g);\n  }\n  // eyes (open)\n  const eyeY=-R*0.04, eyeX=R*0.31;\n  const eL=S(\"ellipse\",{cx:-eyeX,cy:eyeY,rx:3.1,ry:3.7,fill:\"#1d2a3a\"},g);\n  const eR=S(\"ellipse\",{cx: eyeX,cy:eyeY,rx:3.1,ry:3.7,fill:\"#1d2a3a\"},g);\n  S(\"circle\",{cx:-eyeX-1,cy:eyeY-1.3,r:1,fill:\"#fff\",\"fill-opacity\":.85},g);\n  S(\"circle\",{cx: eyeX-1,cy:eyeY-1.3,r:1,fill:\"#fff\",\"fill-opacity\":.85},g);\n  // tired eyes (lines) hidden\n  const tL=S(\"rect\",{x:-eyeX-5,y:eyeY-1.2,width:10,height:2.6,rx:1.3,fill:\"#1d2a3a\",display:\"none\"},g);\n  const tR=S(\"rect\",{x: eyeX-5,y:eyeY-1.2,width:10,height:2.6,rx:1.3,fill:\"#1d2a3a\",display:\"none\"},g);\n  // mouth\n  const mouth=S(\"path\",{d:\"\",stroke:\"#1d2a3a\",\"stroke-width\":3,fill:\"none\",\"stroke-linecap\":\"round\"},g);\n\n  const M={\n    happy:    `M ${-R*0.26} ${R*0.20} Q 0 ${R*0.46} ${R*0.26} ${R*0.20}`,\n    neutral:  `M ${-R*0.20} ${R*0.30} Q 0 ${R*0.37} ${R*0.20} ${R*0.30}`,\n    soft:     `M ${-R*0.20} ${R*0.26} Q 0 ${R*0.40} ${R*0.20} ${R*0.26}`,\n    tired:    `M ${-R*0.22} ${R*0.36} Q 0 ${R*0.20} ${R*0.22} ${R*0.36}`,\n    sad:      `M ${-R*0.24} ${R*0.36} Q 0 ${R*0.16} ${R*0.24} ${R*0.36}`,\n  };\n  function expr(name){\n    let tired=false, open=false, oh=false;\n    if(name===\"tired\")tired=true;\n    if(name===\"excited\")open=true;\n    if(name===\"surprised\")oh=true;\n    tL.style.display=tired?\"\":\"none\"; tR.style.display=tired?\"\":\"none\";\n    eL.style.display=tired?\"none\":\"\"; eR.style.display=tired?\"none\":\"\";\n    if(open){\n      mouth.setAttribute(\"fill\",\"#1d2a3a\");\n      mouth.setAttribute(\"d\",`M ${-R*0.28} ${R*0.16} Q 0 ${R*0.30} ${R*0.28} ${R*0.16} Q 0 ${R*0.56} ${-R*0.28} ${R*0.16} Z`);\n    }else if(oh){\n      mouth.setAttribute(\"fill\",\"#1d2a3a\");\n      mouth.setAttribute(\"d\",`M -5 ${R*0.30} a 5 6 0 1 0 10 0 a 5 6 0 1 0 -10 0`);\n    }else{\n      mouth.setAttribute(\"fill\",\"none\");\n      mouth.setAttribute(\"d\",M[name]||M.happy);\n    }\n  }\n  expr(\"soft\");\n  return {\n    g,\n    set(x,y,s,name,rot){ tf(g,x,y,s==null?1:s,rot||0); if(name)expr(name); g.style.display=\"\"; g.style.opacity=\"1\"; },\n    hide(){ g.style.display=\"none\"; }\n  };\n}\nconst pro=makeChar(\"pro\");\nconst el =makeChar(\"el\");\nfunction bob(t,amp,spd,ph){ return Math.sin(t*spd+(ph||0))*amp; }\n\n/* draw a small \"friend\" figure into a group.\n   mode: \"screen\" = flat mint character; \"holo\" = glowing cyan hologram.\n   returns {g, arm(handExtend0to1), setExpr} — arm waves/extends via update. */\nfunction drawFriend(parent, mode){\n  const g=S(\"g\",{},parent);\n  const holo=mode===\"holo\";\n  const R=34;\n  const col = holo? \"#bdeeff\" : \"#68c3a6\";\n  const dk  = holo? \"#7fd4f0\" : \"#3f9d82\";\n  const op0 = holo? 0.82 : 1;\n  if(holo){ S(\"circle\",{cx:0,cy:2,r:70,fill:\"url(#gHolo)\"},g); }\n  // shadow only for screen mode\n  if(!holo) S(\"ellipse\",{cx:0,cy:R*0.98,rx:R*0.9,ry:R*0.18,fill:\"#0b3b30\",\"fill-opacity\":.18},g);\n  // left arm (static-ish)\n  S(\"path\",{d:`M ${-R+5} 3 q -9 1 -12 7`,stroke:dk,\"stroke-width\":4.5,fill:\"none\",\"stroke-linecap\":\"round\",opacity:op0},g);\n  // right arm — animated (wave / reach)\n  const armR=S(\"path\",{d:`M ${R-5} 3 q 9 -1 12 -7`,stroke:dk,\"stroke-width\":4.5,fill:\"none\",\"stroke-linecap\":\"round\",opacity:op0},g);\n  const handR=S(\"circle\",{cx:R+9,cy:-6,r:5.2,fill:col,stroke:dk,\"stroke-width\":2,opacity:op0},g);\n  // body\n  const body=S(\"circle\",{cx:0,cy:0,r:R,fill:col,stroke:dk,\"stroke-width\":3,opacity:op0},g);\n  if(holo){ body.setAttribute(\"fill-opacity\",\".55\"); }\n  // face\n  S(\"ellipse\",{cx:-R*0.30,cy:-R*0.04,rx:3,ry:3.5,fill:\"#1d3a34\",opacity:op0},g);\n  S(\"ellipse\",{cx: R*0.30,cy:-R*0.04,rx:3,ry:3.5,fill:\"#1d3a34\",opacity:op0},g);\n  S(\"path\",{d:`M ${-R*0.24} ${R*0.22} Q 0 ${R*0.44} ${R*0.24} ${R*0.22}`,stroke:\"#1d3a34\",\"stroke-width\":3,fill:\"none\",\"stroke-linecap\":\"round\",opacity:op0},g);\n  // hologram scan lines\n  if(holo){\n    for(let i=-2;i\u003c=2;i++){\n      S(\"line\",{x1:-R*0.8,y1:i*11,x2:R*0.8,y2:i*11,stroke:\"#eafbff\",\"stroke-width\":1,opacity:.22},g);\n    }\n  }\n  return {\n    g,\n    // w: wave phase amount (0 rest, animates); reach: 0 rest .. 1 hand extended toward left(-x)\n    pose(t,waveAmt,reach){\n      // waving right hand up-down\n      const wy = -6 + Math.sin(t*3.4)*7*waveAmt;\n      const wx = R+9 + Math.cos(t*3.4)*3*waveAmt;\n      // reaching: hand comes toward the viewer-left (negative x) and slightly down/level\n      const rx = lerp(wx, -R-16, reach);\n      const ry = lerp(wy,  -2,   reach);\n      handR.setAttribute(\"cx\",rx.toFixed(1));\n      handR.setAttribute(\"cy\",ry.toFixed(1));\n      armR.setAttribute(\"d\",`M ${(R-6)*(1-reach) + (-R+6)*reach} ${3} Q ${rx*0.55} ${ry-6} ${rx*0.86} ${ry}`);\n    }\n  };\n}\n\n/* ============================================================\n   PHASE BUILDERS  (each returns {g, update(t)})\n   ============================================================ */\n\n/* ---- PHASE 1 : soft opening in space ---- */\nfunction buildP1(){\n  const g=S(\"g\",{},stage);\n  const ocx=524, ocy=250, orx=138, ory=62;\n  S(\"ellipse\",{cx:ocx,cy:ocy,rx:orx,ry:ory,fill:\"none\",stroke:\"#4db7eb\",\"stroke-width\":2.2,\n    \"stroke-dasharray\":\"3 7\",\"stroke-linecap\":\"round\",opacity:.8},g);\n  const trail=S(\"path\",{d:\"\",fill:\"none\",stroke:\"#7fcdf6\",\"stroke-width\":3,\"stroke-linecap\":\"round\",opacity:.7},g);\n  return {g,update(t){\n    if(t\u003c7){ pro.hide(); el.hide(); g.setAttribute(\"opacity\",0); return; }\n    const intro=easeOut(win(t,7,9.6));\n    g.setAttribute(\"opacity\", intro*(1-win(t,26.5,29.5)));\n    // gentle orbit (slower than usual)\n    const ang=t*0.62;\n    const ex=ocx+Math.cos(ang)*orx, ey=ocy+Math.sin(ang)*ory;\n    const a0=ang-1.5;\n    const p1x=ocx+Math.cos(a0)*orx, p1y=ocy+Math.sin(a0)*ory;\n    trail.setAttribute(\"d\",`M ${p1x.toFixed(1)} ${p1y.toFixed(1)} A ${orx} ${ory} 0 0 1 ${ex.toFixed(1)} ${ey.toFixed(1)}`);\n    trail.setAttribute(\"stroke-dasharray\",\"2 6\");\n    const out=ease(win(t,26.5,30));\n    const proX=lerp(300,120,out), proY=lerp(250,360,out)+bob(t,3,1.3);\n    const proS=lerp(1.0,0.82,out);\n    const elX=lerp(ex,150,out), elY=lerp(ey,252,out)+bob(t,2.4,1.2);\n    const elS=lerp(0.9,0.8,out);\n    pro.set(proX,proY,proS,\"happy\");\n    el.set(elX,elY,elS, out>0.5?\"neutral\":\"soft\");\n  }};\n}\n\n/* ---- PHASE 2 : the screen you can't touch ---- */\nfunction buildP2(){\n  const g=S(\"g\",{},stage);\n  // monitor\n  const mon=S(\"g\",{},g);\n  S(\"rect\",{x:452,y:150,width:250,height:172,rx:16,fill:\"#eaf6ff\",stroke:\"#4db7eb\",\"stroke-width\":3},mon);\n  S(\"rect\",{x:468,y:166,width:218,height:140,rx:9,fill:\"#0e2244\",stroke:\"#2b5c8f\",\"stroke-width\":2},mon);\n  S(\"rect\",{x:560,y:322,width:34,height:16,rx:3,fill:\"#bcd7ea\"},mon);       // neck\n  S(\"rect\",{x:530,y:336,width:94,height:9,rx:4,fill:\"#a9cbe0\"},mon);        // stand base\n  // screen glow\n  const scrGlow tle=ease(win(t,228,233));\n      pro.set(lerp(738,516,settle),lerp(336,304,settle)+bob(t,1.6,1.0),lerp(0.72,0.82,settle),\"happy\");\n      el.set(lerp(326,336,settle),lerp(286,300,settle)+bob(t,1.4,1.0),0.84, t\u003c236?\"soft\":\"happy\");\n      op(recap,0);\n    }\n    // 242-255 recap\n    op(recap, win(t,243,245)*(1-win(t,254,256)));\n    if(t>=242 && t\u003c256){\n      op(memo,0);\n      op(rowA, win(t,243.5,245.5)); op(rowB, win(t,249,251));\n      pro.set(120,362+bob(t,2.4,1.1),0.8,\"happy\");\n      el.set(742,362+bob(t,2,1.2),0.78,\"soft\");\n    }\n    // 256-262 space teaser: chars centered, El leans toward Pro\n    if(t>=256){\n      op(recap,0); op(memo,0);\n      const lean = t>259 ? Math.sin(t*2)*3 : 0;\n      pro.set(338,300+bob(t,2.4,1.1),0.92,\"happy\");\n      el.set(548-lean*1.5,308+bob(t,2,1.1),0.86,\"soft\", lean);\n    }\n  }};\n}\n\nconst P1=buildP1(),P2=buildP2(),P3=buildP3(),P4=buildP4(),P5=buildP5(),P6=buildP6();\nconst phases=[\n  {a:0,  b:30, o:P1},\n  {a:30, b:82, o:P2},\n  {a:82, b:128,o:P3},\n  {a:128,b:178,o:P4},\n  {a:178,b:228,o:P5},\n  {a:228,b:262,o:P6},\n];\n\n/* ============================================================\n   SCHEDULES\n   ============================================================ */\nconst headings=[\n  {a:8,  b:27,  text:\"Episode 3 — A Hologram You Can Touch\", style:\"space\"},\n  {a:31, b:80.5,text:\"Close, but out of reach\",             style:\"explain\"},\n  {a:84, b:127, text:\"Sound is a push\",                     style:\"explain\"},\n  {a:130,b:177, text:\"Aim many, meet at one\",               style:\"explain\"},\n  {a:180,b:227, text:\"A shape you can feel\",                style:\"explain\"},\n  {a:230,b:241.5,text:\"So — can a hologram touch back?\",    style:\"explain\"},\n  {a:243,b:254, text:\"Quick recap\",                         style:\"explain\"},\n  {a:256,b:261, text:\"Who would you reach for?\",            style:\"space\"},\n];\n\nconst lines=[\n  [\"PRO\",9,14.5,[\"Last time we promised something strange —\",\"a hologram you could touch.\"]],\n  [\"PRO\",15,20.5,[\"Today's a quiet one. What if you could\",\"hug someone far away?\"]],\n  [\"EL\",21.2,25,[\"...Someone far away.\"]],\n  [\"PRO\",25.6,29.6,[\"Come with me. Let me show you.\"]],\n\n  [\"PRO\",32,37.5,[\"Here's a screen. And there's your friend.\"]],\n  [\"EL\",41.5,46.5,[\"Hi! I've missed you —\"]],\n  [\"EL\",51,57,[\"...oh. My hand went right through.\"]],\n  [\"EL\",60,67,[\"I can see them. I just can't reach them.\"]],\n  [\"PRO\",70,76.5,[\"Seeing isn't enough, is it.\",\"You want to feel.\"]],\n  [\"PRO\",77.5,81.5,[\"What if we made a touch... out of air?\"]],\n\n  [\"PRO\",84.5,89.5,[\"Watch — I'll clap right by your cheek.\"]],\n  [\"EL\",91.5,96,[\"I felt that. A little push of air.\"]],\n  [\"PRO\",99,106,[\"That's what sound is: a wave of pressure.\",\"Every clap nudges the air.\"]],\n  [\"PRO\",109,116,[\"And a wave can be aimed —\",\"steered to one exact spot.\"]],\n  [\"EL\",119,125,[\"Aimed... at a single spot.\"]],\n\n  [\"PRO\",131,137,[\"So we line up many tiny speakers.\"]],\n  [\"PRO\",139,146,[\"Each sends a wave. They all arrive\",\"at the same place, together.\"]],\n  [\"PRO\",148,154.5,[\"Where they meet, the pushes stack up —\",\"a knot of pressure in mid-air.\"]],\n  [\"EL\",157,163.5,[\"Oh! I can feel it — right above my hand.\"]],\n  [\"PRO\",166,172.5,[\"That's ultrasound. Too high to hear,\",\"but your skin feels it press.\"]],\n  [\"EL\",173.5,177.8,[\"So you could draw a shape... in the air?\"]],\n\n  [\"PRO\",181,187,[\"Now we draw far more than a dot.\"]],\n  [\"PRO\",189,196,[\"Thousands of little pushes, together —\",\"the outline of a hand.\"]],\n  [\"EL\",200,206,[\"It's them. It really looks like them.\"]],\n  [\"EL\",211,217,[\"I'm reaching out...\"]],\n  [\"EL\",221.5,227,[\"...and it's warm. I can feel their hand.\"]],\n\n  [\"EL\",230.5,236,[\"Thank you for showing me this.\"]],\n  [\"PRO\",238,243.5,[\"Distance is just a gap.\",\"Physics is good at closing gaps.\"]],\n  [\"PRO\",246,251.5,[\"Focused sound you can feel.\",\"Many emitters draw a shape.\"]],\n  [\"EL\",256.5,261,[\"Next time: windows that make electricity.\"]],\n];\n\n/* ============================================================\n   RENDER\n   ============================================================ */\nfunction setBackgrounds(t){\n  let spaceOp;\n  if(t\u003c27) spaceOp=1;\n  else if(t\u003c30) spaceOp=1-win(t,27,30);\n  else if(t\u003c255) spaceOp=0;\n  else spaceOp=win(t,255,258);\n  op(bgSpace,spaceOp);\n  op(bgPale, clamp(1-spaceOp,0,1));\n}\nfunction setHeading(t){\n  let cur=null;\n  for(const h of headings) if(t>=h.a&&t\u003c=h.b){cur=h;break;}\n  if(!cur){ op(headG,0); return; }\n  const fin = Math.min(win(t,cur.a,cur.a+0.6), 1-win(t,cur.b-0.6,cur.b));\n  op(headG, fin);\n  headText.textContent=cur.text;\n  headSub.textContent=\"\";\n  if(cur.style===\"space\"){ headText.setAttribute(\"fill\",\"#ffd24a\"); headText.setAttribute(\"stroke\",\"#0b1838\"); }\n  else { headText.setAttribute(\"fill\",\"#214a78\"); headText.setAttribute(\"stroke\",\"#ffffff\"); }\n}\nfunction setDialogue(t){\n  let cur=null;\n  for(const l of lines) if(t>=l[1]&&t\u003c=l[2]){cur=l;}\n  if(!cur){ op(dlgG,0); return; }\n  op(dlgG,1);\n  const who=cur[0], txt=cur[3];\n  dlgLabel.textContent=who+\":\";\n  dlgLabel.setAttribute(\"fill\", who===\"PRO\"?\"#ffd24a\":\"#8fd0ff\");\n  if(txt.length>1){\n    dlgLabel.setAttribute(\"y\",424);\n    dlgLine1.setAttribute(\"y\",424); dlgLine1.textContent=txt[0];\n    dlgLine2.setAttribute(\"y\",451); dlgLine2.textContent=txt[1]; op(dlgLine2,1);\n  }else{\n    dlgLabel.setAttribute(\"y\",437);\n    dlgLine1.setAttribute(\"y\",437); dlgLine1.textContent=txt[0];\n    dlgLine2.textContent=\"\"; op(dlgLine2,0);\n  }\n}\nfunction setLogo(t){\n  let o=0;\n  if(t\u003c6.8){ o=Math.min(win(t,0.6,1.6), 1-win(t,5.7,6.7)); }\n  else if(t>=258.6){ o=win(t,258.8,259.8); }\n  op(logoG,o);\n}\nfunction setFade(t){\n  let   "4": {"title": "Episode 4 — Windows That Make Power", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>WHAT IF?.. — Episode 4: Windows That Make Power\u003c/title>\n\u003cstyle>\n  :root{\n    --navy1:#0b183b; --navy2:#173f72;\n    --pale1:#dcf2fc; --pale2:#cfeafa;\n    --pro:#f0997b; --proDk:#c66a4f; --proSign:#8a3b28;\n    --el:#85b7eb; --elDk:#4f86c9; --elSign:#274f86;\n    --cyan:#4db7eb; --cyanDk:#378add;\n    --dlg:#0a1733; --dlgEdge:#4db7eb;\n    --yellow:#ffd24a; --headBlue:#214a78; --floor:#9bc4dd;\n  }\n  *{box-sizing:border-box;margin:0;padding:0}\n  html,body{height:100%}\n  body{\n    background:#05060c;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",system-ui,Arial,sans-serif;\n    color:#dfe9f5; display:flex; align-items:center; justify-content:center;\n    min-height:100vh; padding:18px;\n  }\n  .wrap{ width:min(960px,100%); }\n  .frame{\n    position:relative; width:100%; aspect-ratio:854/480;\n    border-radius:14px; overflow:hidden;\n    box-shadow:0 20px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(120,170,230,.18);\n    background:#0b183b;\n  }\n  svg#film{ position:absolute; inset:0; width:100%; height:100%; display:block; }\n  text{ font-family:\"Trebuchet MS\",\"Segoe UI\",system-ui,Arial,sans-serif; }\n\n  /* Controls */\n  .bar{\n    margin-top:12px; display:flex; align-items:center; gap:12px;\n    background:#0d1426; border:1px solid #1f2c47; border-radius:12px;\n    padding:9px 12px;\n  }\n  .btn{\n    appearance:none; border:none; cursor:pointer; color:#06101f;\n    background:linear-gradient(180deg,#7fc4f3,#4aa0e6);\n    font-weight:700; font-size:13px; letter-spacing:.3px;\n    width:42px; height:34px; border-radius:9px; display:flex;\n    align-items:center; justify-content:center; transition:filter .15s;\n    flex:0 0 auto;\n  }\n  .btn:hover{filter:brightness(1.08)}\n  .btn svg{width:16px;height:1 IF?.. — Episode 4: \"Windows That Make Power\"\n   Energetic again after the quiet Ep3. El is loud & bouncy.\n   Physics: transparent solar — a clear film lets visible light\n   through (you still see out) but catches invisible UV/infrared\n   and turns it into electricity. Same slide style as Eps 1-3,\n   all driven from one master clock `T` (seconds), procedurally.\n   ============================================================ */\nconst SVGNS=\"http://www.w3.org/2000/svg\";\nconst film=document.getElementById(\"film\");\nconst W=854,H=480;\nconst TOTAL=262; // seconds (~4:22)\n\n/* ---------- tiny helpers ---------- */\nfunction S(tag,attrs,parent){\n  const e=document.createElementNS(SVGNS,tag);\n  if(attrs)for(const k in attrs){\n    if(k===\"text\"){e.textContent=attrs[k];}\n    else e.setAttribute(k,attrs[k]);\n  }\n  if(parent)parent.appendChild(e);\n  return e;\n}\nconst clamp=(v,a,b)=>v\u003ca?a:v>b?b:v;\nconst lerp=(a,b,p)=>a+(b-a)*p;\nconst ease=p=>{p=clamp(p,0,1);return p*p*p*(p*(p*6-15)+10);};\nconst easeOut=p=>{p=clamp(p,0,1);return 1-(1-p)*(1-p);};\nconst easeIn=p=>{p=clamp(p,0,1);return p*p;};\nconst win=(t,a,b)=>clamp((t-a)/(b-a),0,1);\nconst seg=(t,a,b)=>(t-a)/(b-a);\nfunction vis(el,on){ el.style.display=on?\"\":\"none\"; }\nfunction op(el,o){ el.setAttribute(\"opacity\",clamp(o,0,1)); }\nfunction tf(el,x,y,s,rot){\n  let t=`translate(${x.toFixed(2)} ${y.toFixed(2)})`;\n  if(rot)t+=` rotate(${rot.toFixed(2)})`;\n  if(s!=null&&s!==1)t+=` scale(${s.toFixed(3)})`;\n  el.setAttribute(\"transform\",t);\n}\nfunction prng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}\n\n/* ============================================================\n   LAYERS\n   ============================================================ */\nconst defs=S(\"defs\",null,film);\nlet g=S(\"linearGradient\",{id:\"gSpace\",x1:0,y1:0,x2:0,y2:1},defs);\nS(\"stop\",{offset:0,\"stop-color\":\"#0b1838\"},g);\nS(\"stop\",{offset:1,\"stop-color\":\"#173f72\"},g);\ng=S(\"linearGradient\",{id:\"gPale\",x1:0,y1:0,x2:0,y2:1},defs);\nS(\"stop\",{offset:0,\"stop-color\":\"#e3f4fd\"},g);\nS(\"stop\",{offset:1,\"stop-color\":\"#cbe8f9\"},g);\n// window daytime sky\ng=S(\"linearGradient\",{id:\"gSky\",x1:0,y1:0,x2:0,y2:1},defs);\nS(\"stop\",{offset:0,\"stop-color\":\"#bfe4ff\"},g);\nS(\"stop\",{offset:.7,\"stop-color\":\"#dcefff\"},g);\nS(\"stop\",{offset:1,\"stop-color\":\"#ffe7bf\"},g);\n// warm sun glow\nlet rg=S(\"radialGradient\",{id:\"gSun\"},defs);\nS(\"stop\",{offset:0,\"stop-color\":\"#fff6c8\",\"stop-opacity\":1},rg);\nS(\"stop\",{offset:.5,\"stop-color\":\"#ffdf7a\",\"stop-opacity\":.85},rg);\nS(\"stop\",{offset:1,\"stop-color\":\"#ffdf7a\",\"stop-opacity\":0},rg);\n// lamp warm glow\nrg=S(\"radialGradient\",{id:\"gGlow\"},defs);\nS(\"stop\",{offset:0,\"stop-color\":\"#fff4c2\",\"stop-opacity\":.95},rg);\nS(\"stop\",{offset:1,\"stop-color\":\"#fff4c2\",\"stop-opacity\":0},rg);\n// city dusk tint (soft)\ng=S(\"linearGradient\",{id:\"gDusk\",x1:0,y1:0,x2:0,y2:1},defs);\nS(\"stop\",{offset:0,\"stop-color\":\"#3a4f7a\",\"stop-opacity\":.42},g);\nS(\"stop\",{offset:1,\"stop-color\":\"#22335c\",\"stop-opacity\":.10},g);\n\n// Background layers\nconst bgSpace=S(\"g\",{id:\"bgSpace\"},film);\nS(\"rect\",{x:0,y:0,width:W,height:H,fill:\"url(#gSpace)\"},bgSpace);\nconst bgPale=S(\"g\",{id:\"bgPale\"},film);\nS(\"rect\",{x:0,y:0,width:W,height:H,fill:\"url(#gPale)\"},bgPale);\nS(\"line\",{x1:0,y1:312,x2:W,y2:312,stroke:\"#9bc4dd\",\"stroke-width\":2,opacity:.7},bgPale);\n\n// stars\n(function(){const r=prng(7);for(let i=0;i\u003c78;i++){\n  const x=r()*W,y=r()*H,rad=r()*1.5+0.6,o=r()*0.6+0.35;\n  S(\"circle\",{cx:x.toFixed(1),cy:y.toFixed(1),r:rad.toFixed(2),fill:\"#dceaff\",opacity:o.toFixed(2)},bgSpace);\n}})();\n// pale-bg dotted top border\n(function(){const r=prng(21);for(let i=0;i\u003c34;i++){\n  const x=10+i*25+ (r()*8-4), y=18+Math.sin(i*0.7) =============================\n   PHASE BUILDERS  (each returns {g, update(t)})\n   ============================================================ */\n\n/* ---- PHASE 1 : fast opening in space ---- */\nfunction buildP1(){\n  const g=S(\"g\",{},stage);\n  const ocx=524, ocy=250, orx=150, ory=70;\n  S(\"ellipse\",{cx:ocx,cy:ocy,rx:orx,ry:ory,fill:\"none\",stroke:\"#4db7eb\",\"stroke-width\":2.2,\n    \"stroke-dasharray\":\"3 7\",\"stroke-linecap\":\"round\",opacity:.85},g);\n  const trail=S(\"path\",{d:\"\",fill:\"none\",stroke:\"#7fcdf6\",\"stroke-width\":3,\"stroke-linecap\":\"round\",opacity:.8},g);\n  return {g,update(t){\n    if(t\u003c7){ pro.hide(); el.hide(); g.setAttribute(\"opacity\",0); return; }\n    const intro=easeOut(win(t,7,9));\n    g.setAttribute(\"opacity\", intro*(1-win(t,26.5,29.5)));\n    const ang=t*1.15;                 // brisk, energetic orbit\n    const ex=ocx+Math.cos(ang)*orx, ey=ocy+Math.sin(ang)*ory;\n    const a0=ang-1.9;\n    const p1x=ocx+Math.cos(a0)*orx, p1y=ocy+Math.sin(a0)*ory;\n    trail.setAttribute(\"d\",`M ${p1x.toFixed(1)} ${p1y.toFixed(1)} A ${orx} ${ory} 0 0 1 ${ex.toFixed(1)} ${ey.toFixed(1)}`);\n    trail.setAttribute(\"stroke-dasharray\",\"2 6\");\n    const out=ease(win(t,26.5,30));\n    const proX=lerp(300,120,out), proY=lerp(252,360,out)+bob(t,4,1.8);\n    const proS=lerp(1.0,0.82,out);\n    const elX=lerp(ex,150,out), elY=lerp(ey,250,out)+bob(t,5,3);\n    const elS=lerp(0.92,0.8,out);\n    pro.set(proX,proY,proS,\"happy\");\n    el.set(elX,elY,elS,\"excited\");\n  }};\n}\n\n/* ---- PHASE 2 : blackout, then the window ---- */\nfunction buildP2(){\n  const g=S(\"g\",{},stage);\n  // dim overlay (room goes dark) — drawn first, window sits on top and stays bright\n  const dim=S(\"rect\",{x:0,y:0,width:W,height:H,fill:\"#0c1c3a\",opacity:0},g);\n  // ceiling lamp (goes off)\n  const lamp=S(\"g\",{},g);\n  S(\"line\",{x1:250,y1:24,x2:250,y2:58,stroke:\"#8aa0bd\",\"stroke-width\":3},lamp);\n  S(\"path\",{d:\"M 230 58 h 40 l -
