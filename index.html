yle:\"explain\"},\n  {a:243,b:254, text:\"Quick recap\",                         style:\"explain\"},\n  {a:256,b:261, text:\"How many windows can you see?\",       style:\"space\"},\n];\n\nconst lines=[\n  [\"EL\",8.5,13,[\"We're back — and I'm all charged up!\",\"What are we catching today?!\"]],\n  [\"PRO\",13.5,19,[\"Today: light we can't even see.\",\"It's hiding all around us.\"]],\n  [\"EL\",19.5,23.5,[\"Invisible light?! Show me, show me!\"]],\n  [\"PRO\",24,29.5,[\"Come inside. Watch this.\"]],\n\n  [\"EL\",32,38,[\"Wait — the lights went out!\",\"Where's the energy?! I'm fading!\"]],\n  [\"EL\",40.5,46,[\"I'm going dim! This is bad, this is bad —\"]],\n  [\"PRO\",48.5,55,[\"Easy. Now look out the window.\"]],\n  [\"PRO\",57,64,[\"You, of all charges, panicking?\",\"There's a whole sea of energy right there.\"]],\n  [\"EL\",67,73.5,[\"...But that's just light.\",\"You only see the street through it.\"]],\n  [\"PRO\",75,82,[\"You do. But what if a window\",\"could feed the whole house too?\"]],\n\n  [\"PRO\",86.5,92,[\"Sunlight isn't one plain beam.\"]],\n  [\"PRO\",94,101,[\"Split it, and it fans into a band —\",\"a whole orchestra of waves.\"]],\n  [\"PRO\",103.5,111,[\"Your eyes catch only the middle:\",\"the rainbow you already know.\"]],\n  [\"PRO\",113.5,121,[\"But past each end is invisible light —\",\"ultraviolet, and infrared.\"]],\n  [\"EL\",124,131,[\"Whoa — can't see it... but it's warm!\"]],\n\n  [\"PRO\",135,141,[\"Now press a clear film onto the glass.\"]],\n  [\"PRO\",143,150,[\"Visible light sails straight through —\",\"you still see right outside.\"]],\n  [\"PRO\",152,160,[\"But the invisible waves? The film grabs\",\"them and turns them into sparks.\"]],\n  [\"EL\",163,170,[\"Energy! Pouring out of a plain window!\"]],\n  [\"PRO\",172,179,[\"Clear as ever — and quietly making power.\"]],\n\n  [\"PRO\",183,190,[\"Now coat every window in the house.\"]],\n  [\"EL\",193,199,[\"Look — energy running to every lamp!\"]],\n  [\"PRO\",202,209,[\"Then the whole street lights up,\",\"glowing like it's the holidays.\"]],\n  [\"EL\",212,218.5,[\"Even my school powers itself now!\"]],\n  [\"PRO\",221,227,[\"Sunlight, caught pane by pane.\"]],\n\n  [\"EL\",230.5,236,[\"I am NEVER going dark again!\"]],\n  [\"PRO\",238,243.5,[\"The energy was here all along —\",\"just behind the glass.\"]],\n  [\"PRO\",246,251.5,[\"Visible light passes through.\",\"Invisible light becomes power.\"]],\n  [\"EL\",256.5,261,[\"Next time: an invisibility cloak!\"]],\n];\n\n/* ============================================================\n   RENDER\n   ============================================================ */\nfunction setBackgrounds(t){\n  let spaceOp;\n  if(t\u003c27) spaceOp=1;\n  else if(t\u003c30) spaceOp=1-win(t,27,30);\n  else if(t\u003c255) spaceOp=0;\n  else spaceOp=win(t,255,258);\n  op(bgSpace,spaceOp);\n  op(bgPale, clamp(1-spaceOp,0,1));\n}\nfunction setHeading(t){\n  let cur=null;\n  for(const h of headings) if(t>=h.a&&t\u003c=h.b){cur=h;break;}\n  if(!cur){ op(headG,0); return; }\n  const fin = Math.min(win(t,cur.a,cur.a+0.6), 1-win(t,cur.b-0.6,cur.b));\n  op(headG, fin);\n  headText.textContent=cur.text;\n  headSub.textContent=\"\";\n  if(cur.style===\"space\"){ headText.setAttribute(\"fill\",\"#ffd24a\"); headText.setAttribute(\"stroke\",\"#0b1838\"); }\n  else { headText.setAttribute(\"fill\",\"#214a78\"); headText.setAttribute(\"stroke\",\"#ffffff\"); }\n}\nfunction setDialogue(t){\n  let cur=null;\n  for(const l of lines) if(t>=l[1]&&t\u003c=l[2]){cur=l;}\n  if(!cur){ op(dlgG,0); return; }\n  op(dlgG,1);\n  const who=cur[0], txt=cur[3];\n  dlgLabel.textContent=who+\":\";\n  dlgLabel.setAttribute(\"fill\", who===\"PRO\"?\"#ffd24a\":\"#8fd0ff\");\n  if(txt.length>1){\n    dlgLabel.setAttribute(\"y\",424);\n    dlgLine1.setAttribute(\"y\",424); dlgLine1.textContent=txt[0];\n    dlgLine2.setAttribute(\"y\",451); dlgLine2.textContent=txt[1]; op(dlgLine2,1);\n  }else{\n    dlgLabel.setAttribute(\"y\",437);\n    dlgLine   "5": {"title": "Episode 5 — The Invisibility Cloak", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>WHAT IF?.. — Episode 5: The Invisibility Cloak\u003c/title>\n\u003cstyle>\n  :root{\n    --navy1:#0b183b; --navy2:#173f72;\n    --pale1:#dcf2fc; --pale2:#cfeafa;\n    --pro:#f0997b; --proDk:#c66a4f; --proSign:#8a3b28;\n    --el:#85b7eb; --elDk:#4f86c9; --elSign:#274f86;\n    --cyan:#4db7eb; --cyanDk:#378add;\n    --dlg:#0a1733; --dlgEdge:#4db7eb;\n    --yellow:#ffd24a; --headBlue:#214a78; --floor:#9bc4dd;\n  }\n  *{box-sizing:border-box;margin:0;padding:0}\n  html,body{height:100%}\n  body{\n    background:#05060c;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",system-ui,Arial,sans-serif;\n    color:#dfe9f5; display:flex; align-items:center; justify-content:center;\n    min-height:100vh; padding:18px;\n  }\n  .wrap{ width:min(960px,100%); }\n  .frame{\n    position:relative; width:100%; aspect-ratio:854/480;\n    border-radius:14px; overflow:hidden;\n    box-shadow:0 20px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(120,170,230,.18);\n    background:#0b183b;\n  }\n  svg#film{ position:absolute; inset:0; width:100%; height:100%; display:block; }\n  text{ font-family:\"Trebuchet MS\",\"Segoe UI\",system-ui,Arial,sans-serif; }\n\n  /* Controls */\n  .bar{\n    margin-top:12px; display:flex; align-items:center; gap:12px;\n    background:#0d1426; border:1px solid #1f2c47; border-radius:12px;\n    padding:9px 12px;\n  }\n  .btn{\n    appearance:none; border:none; cursor:pointer; color:#06101f;\n    background:linear-gradient(180deg,#7fc4f3,#4aa0e6);\n    font-weight:700; font-size:13px; letter-spacing:.3px;\n    width:42px; height:34px; border-radius:9px; display:flex;\n    align-items:center; justify-content:center; transition:filter .15s;\n    flex:0 0 auto;\n  }\n  .btn:hover{filter:brightness(1.08)}\n  .btn svg{width:16px;height:16p "]],\n  [\"EL\",256.5,261,[\"Next time: a secret no spy can steal!\"]],\n];\n\n/* ============================================================\n   RENDER\n   ============================================================ */\nfunction setBackgrounds(t){\n  let spaceOp;\n  if(t\u003c27) spaceOp=1;\n  else if(t\u003c30) spaceOp=1-win(t,27,30);\n  else if(t\u003c255) spaceOp=0;\n  else spaceOp=win(t,255,258);\n  op(bgSpace,spaceOp);\n  op(bgPale, clamp(1-spaceOp,0,1));\n}\nfunction setHeading(t){\n  let cur=null;\n  for(const h of headings) if(t>=h.a&&t\u003c=h.b){cur=h;break;}\n  if(!cur){ op(headG,0); return; }\n  const fin = Math.min(win(t,cur.a,cur.a+0.6), 1-win(t,cur.b-0.6,cur.b));\n  op(headG, fin);\n  headText.textContent=cur.text;\n  headSub.textContent=\"\";\n  if(cur.style===\"space\"){ headText.setAttribute(\"fill\",\"#ffd24a\"); headText.setAttribute(\"stroke\",\"#0b1838\"); }\n  else { headText.setAttribute(\"fill\",\"#214a78\"); headText.setAttribute(\"stroke\",\"#ffffff\"); }\n}\nfunction setDialogue(t){\n  let cur=null;\n  for(const l of lines) if(t>=l[1]&&t\u003c=l[2]){cur=l;}\n  if(!cur){ op(dlgG,0); return; }\n  op(dlgG,1);\n  const who=cur[0], txt=cur[3];\n  dlgLabel.textContent=who+\":\";\n  dlgLabel.setAttribute(\"fill\", who===\"PRO\"?\"#ffd24a\":\"#8fd0ff\");\n  if(txt.length>1){\n    dlgLabel.setAttribute(\"y\",424);\n    dlgLine1.setAttribute(\"y\",424); dlgLine1.textContent=txt[0];\n    dlgLine2.setAttribute(\"y\",451); dlgLine2.textContent=txt[1]; op(dlgLine2,1);\n  }else{\n    dlgLabel.setAttribute(\"y\",437);\n    dlgLine1.setAttribute(\"y\",437); dlgLine1.textContent=txt[0];\n    dlgLine2.textContent=\"\"; op(dlgLine2,0);\n  }\n}\nfunction setLogo(t){\n  let o=0;\n  if(t\u003c6.8){ o=Math.min(win(t,0.6,1.6), 1-win(t,5.7,6.7)); }\n  else if(t>=258.6){ o=win(t,258.8,259.8); }\n  op(logoG,o);\n}\nfunction setFade(t){\n  let o=0;\n  if(t\u003c0.6) o=1-win(t,0,0.6);\n  if(t>260.3) o=Math.max(o, win(t,260.3,262));\n  op(fade,o);\n}\n\nfunction ren HAT IF?.. — Episode 7: \"A Secret No Spy Can Steal\"\n   Detective episode. Chatty El sends a secret note — and every\n   shadow on the wire reads it. The fix is quantum key\n   distribution: information carried by \"spinning coins\" of\n   light that any peek irreversibly changes, so eavesdropping\n   always leaves a mark. Metaphor ladder: soap-bubble letter →\n   spinning coins → two cities on a guarded beam.\n   Same slide style as Eps 1-6, one master clock `T`.\n   ============================================================ */\nconst SVGNS=\"http://www.w3.org/2000/svg\";\nconst film=document.getElementById(\"film\");\nconst W=854,H=480;\nconst TOTAL=262; // seconds (~4:22)\n\n/* ---------- tiny helpers ---------- */\nfunction S(tag,attrs,parent){\n  const e=document.createElementNS(SVGNS,tag);\n  if(attrs)for(const k in attrs){\n    if(k===\"text\"){e.textContent=attrs[k];}\n    else e.setAttribute(k,attrs[k]);\n  }\n  if(parent)parent.appendChild(e);\n  return e;\n}\nconst clamp=(v,a,b)=>v\u003ca?a:v>b?b:v;\nconst lerp=(a,b,p)=>a+(b-a)*p;\nconst ease=p=>{p=clamp(p,0,1);return p*p*p*(p*(p*6-15)+10);};\nconst easeOut=p=>{p=clamp(p,0,1);return 1-(1-p)*(1-p);};\nconst easeIn=p=>{p=clamp(p,0,1);return p*p;};\nconst win=(t,a,b)=>clamp((t-a)/(b-a),0,1);\nconst seg=(t,a,b)=>(t-a)/(b-a);\nfunction vis(el,on){ el.style.display=on?\"\":\"none\"; }\nfunction op(el,o){ el.setAttribute(\"opacity\",clamp(o,0,1)); }\nfunction tf(el,x,y,s,rot){\n  let t=`translate(${x.toFixed(2)} ${y.toFixed(2)})`;\n  if(rot)t+=` rotate(${rot.toFixed(2)})`;\n  if(s!=null&&s!==1)t+=` scale(${s.toFixed(3)})`;\n  el.setAttribute(\"transform\",t);\n}\nfunction prng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}\n\n/* ============================================================\n   LAYERS\n   ============================================================ */\nconst defs=S(\"defs\",null,film);\nlet g=S(\"linearGradient\",{id:\"gSpace\",x1:0,y1:0,x2:0,y2:1},defs);\nS(\"stop\",{offset:0,\"stop-color\":\"#0b1838\"},g);\nS(\"stop\",{offset:1,\"stop-color\":\"#173f72\"},g);\ng=S(\"linearGradient\",{id:\"gPale\",x1:0,y1:0,x2:0,y2:1},defs);\nS(\"stop\",{offset:0,\"stop-color\":\"#e3f4fd\"},g);\nS(\"stop\",{offset:1,\"stop-color\":\"#cbe8f9\"},g);\nlet rg=S(\"radialGradient\",{id:\"gGlow\"},defs);\nS(\"stop\",{offset:0,\"stop-color\":\"#fff4c2\",\"stop-opacity\":.95},rg);\nS(\"stop\",{offset:1,\"stop-color\":\"#fff4c2\",\"stop-opacity\":0},rg);\n// soap-bubble shimmer\nrg=S(\"radialGradient\",{id:\"gBub\"},defs);\nS(\"stop\",{offset:0,\"stop-color\":\"#ffffff\",\"stop-opacity\":.12},rg);\nS(\"stop\",{offset:.75,\"stop-color\":\"#cfeaff\",\"stop-opacity\":.28},rg);\nS(\"stop\",{offset:1,\"stop-color\":\"#9fd0ff\",\"stop-opacity\":.5},rg);\n\n// Background layers\nconst bgSpace=S(\"g\",{id:\"bgSpace\"},film);\nS(\"rect\",{x:0,y:0,width:W,height:H,fill:\"url(#gSpace)\"},bgSpace);\nconst bgPale=S(\"g\",{id:\"bgPale\"},film);\nS(\"rect\",{x:0,y:0,width:W,height:H,fill:\"url(#gPale)\"},bgPale);\nS(\"line\",{x1:0,y1:312,x2:W,y2:312,stroke:\"#9bc4dd\",\"stroke-width\":2,opacity:.7},bgPale);\n\n// stars\n(function(){const r=prng(7);for(let i=0;i\u003c78;i++){\n  const x=r()*W,y=r()*H,rad=r()*1.5+0.6,o=r()*0.6+0.35;\n  S(\"circle\",{cx:x.toFixed(1),cy:y.toFixed(1),r:rad.toFixed(2),fill:\"#dceaff\",opacity:o.toFixed(2)},bgSpace);\n}})();\n// pale-bg dotted top border\n(function(){const r=prng(21);for(let i=0;i\u003c34;i++){\n  const x=10+i*25+ (r()*8-4), y=18+Math.sin(i*0.7)*10 + r()*8;\n  S(\"circle\",{cx:x.toFixed(1),cy:y.toFixed(1),r:(r()*1.6+1).toFixed(2),fill:\"#5ea3d4\",opacity:.55},bgPale);\n}})();\n\n// Scene container\nconst stage=S(\"g\",{id:\"stage\"},film);\n// Characters layer\nconst charLayer=S(\"g\",{id:\"chars\"},film);\n// Props in front of characters\nconst frontLayer=S(\"g\",{id:\"front\"},film);\n// Glow / sparkle layer above everything\nconst glowL  tired=false, open=false, oh=false;\n    if(name===\"tired\")tired=true;\n    if(name===\"excited\")open=true;\n    if(name===\"surprised\")oh=true;\n    tL.style.display=tired?\"\":\"none\"; tR.style.display=tired?\"\":\"none\";\n    eL.style.display=tired?\"none\":\"\"; eR.style.display=tired?\"none\":\"\";\n    if(open){\n      mouth.setAttribute(\"fill\",\"#1d2a3a\");\n      mouth.setAttribute(\"d\",`M ${-R*0.28} ${R*0.16} Q 0 ${R*0.30} ${R*0.28} ${R*0.16} Q 0 ${R*0.56} ${-R*0.28} ${R*0.16} Z`);\n    }else if(oh){\n      mouth.setAttribute(\"fill\",\"#1d2a3a\");\n      mouth.setAttribute(\"d\",`M -5 ${R*0.30} a 5 6 0 1 0 10 0 a 5 6 0 1 0 -10 0`);\n    }else{\n      mouth.setAttribute(\"fill\",\"none\");\n      mouth.setAttribute(\"d\",M[name]||M.happy);\n    }\n  }\n  expr(\"happy\");\n  return {\n    g,\n    set(x,y,s,name,rot){ tf(g,x,y,s==null?1:s,rot||0); if(name)expr(name); g.style.display=\"\"; g.style.opacity=\"1\"; },\n    hide(){ g.style.display=\"none\"; }\n  };\n}\nconst pro=makeChar(\"pro\");\nconst el =makeChar(\"el\");\nfunction bob(t,amp,spd,ph){ return Math.sin(t*spd+(ph||0))*amp; }\n\n// El's little green pen-pal\nfunction makeFriend(parent){\n  const g=S(\"g\",{opacity:0},parent);\n  S(\"ellipse\",{cx:0,cy:23,rx:22,ry:5,fill:\"#0b1838\",\"fill-opacity\":.18},g);\n  S(\"circle\",{cx:0,cy:0,r:24,fill:\"#8fce9a\",stroke:\"#5fa370\",\"stroke-width\":3},g);\n  S(\"ellipse\",{cx:-7,cy:-2,rx:2.8,ry:3.4,fill:\"#1d2a3a\"},g);\n  S(\"ellipse\",{cx: 7,cy:-2,rx:2.8,ry:3.4,fill:\"#1d2a3a\"},g);\n  S(\"path\",{d:\"M -7 8 Q 0 14 7 8\",fill:\"none\",stroke:\"#1d2a3a\",\"stroke-width\":2.6,\"stroke-linecap\":\"round\"},g);\n  return {g,set(x,y,s,o){ tf(g,x,y,s==null?1:s); op(g,o==null?1:o); }};\n}\n// a shifty shadow-spy\nfunction makeSpy(parent){\n  const g=S(\"g\",{opacity:0},parent);\n  S(\"path\",{d:\"M -26 24 Q -32 -18 0 -28 Q 32 -18 26 24 Q 14 18 8 24 Q 0 18 -8 24 Q -14 18 -26 24 Z\",\n    fill:\"#2b3d63\",\"fill-opacity\":.94,stroke:\"#1b2a4a\",\"stroke-                style:\"space\"},\n];\n\nconst lines=[\n  [\"EL\",8.5,13,[\"Shhh! I've got a SECRET note!\",\"Nobody look. ESPECIALLY not you.\"]],\n  [\"PRO\",13.5,19,[\"A secret, hm? Then today we learn\",\"to send one that CANNOT be peeked.\"]],\n  [\"EL\",19.5,23.5,[\"Impossible to peek?! Tell me! Quietly!\"]],\n  [\"PRO\",24,29.5,[\"First — watch what happens without it.\"]],\n\n  [\"EL\",31,36,[\"Dear friend: meet me at the big oak.\",\"Top secret! Sending it now!\"]],\n  [\"EL\",37.5,41,[\"Wait. Who's THAT next to my wire?!\"]],\n  [\"EL\",42.5,47,[\"He read it! And passed it along?!\"]],\n  [\"EL\",48.5,53,[\"ANOTHER one?! Stop reading my mail!\"]],\n  [\"EL\",56.5,62,[\"My friend got it... but so did\",\"every sneaky shadow on the way!\"]],\n  [\"EL\",62.5,68,[\"I wanted ONE reader. I got a crowd.\"]],\n  [\"PRO\",69,75.5,[\"The trouble with chatty wires:\",\"anyone can peek, and no one can tell.\"]],\n  [\"PRO\",76.5,83.5,[\"But what if the letter itself\",\"broke the moment someone peeked?\"]],\n\n  [\"PRO\",86.5,93,[\"Imagine the note is a soap bubble.\",\"Carried gently — it arrives whole.\"]],\n  [\"PRO\",95,101,[\"Float it along... see? Perfectly fine,\",\"because nobody has touched it.\"]],\n  [\"EL\",103,108,[\"Uh oh. Sneaky hand incoming —\"]],\n  [\"PRO\",109.5,116,[\"POP! The peek destroyed the letter —\",\"and left proof for all to see.\"]],\n  [\"EL\",118,124,[\"So you can't peek AND stay hidden!\",\"The bubble tattles on you!\"]],\n  [\"PRO\",125.5,131,[\"Exactly. Now let's build that idea\",\"out of pure light.\"]],\n\n  [\"PRO\",135,142,[\"Each speck of light carries the key —\",\"like a coin spun into a blur.\"]],\n  [\"PRO\",144,151,[\"While it spins, it's not heads OR tails.\",\"It's both — until somebody catches it.\"]],\n  [\"EL\",153,158,[\"And if a spy snatches one mid-spin?\"]],\n  [\"PRO\",159.5,166.5,[\"The catch itself stops the spin —\",\"the coin changes, and keeps the mark.\"]],\n  [\"EL\",168.5,175,[\"So a spy can't take a peek without\",\"signing his own confession!\"]],\n  [\"PRO\",176,179.5,[\"Physics itself guards the secret.\"]],\n\n  [\"PRO\",183,190,[\"Two far-away cities, trading keys\",\"along a single beam of light.\"]],\n  [\"PRO\",192,198.5,[\"Green light: every coin arrived\",\"still spinning. Nobody peeked.\"]],\n  [\"EL\",200,205,[\"Messages flying with a bodyguard\",\"made of physics!\"]],\n  [\"EL\",206.5,211,[\"Hold on... who's that on the ladder?!\"]],\n  [\"PRO\",212,217,[\"Watch — the moment he touches the beam...\"]],\n  [\"EL\",218,223.5,[\"RED ALERT! The coins told on him!\",\"GOTCHA, mister spy!\"]],\n  [\"PRO\",224.5,227.5,[\"Caught by the laws of nature.\"]],\n\n  [\"EL\",230.5,236.5,[\"One more try — straight to my friend,\",\"sealed with spinning light!\"]],\n  [\"EL\",238,243,[\"Delivered! Whole! And ONLY to him!\"]],\n  [\"PRO\",246,251.5,[\"A peek always changes the coin —\",\"so no spy can hide a peek.\"]],\n  [\"EL\",256.5,261,[\"Next time: a computer that tries\",\"every path at ONCE!\"]],\n];\n\n/* ============================================================\n   RENDER\n   ============================================================ */\nfunction setBackgrounds(t){\n  let spaceOp;\n  if(t\u003c27) spaceOp=1;\n  else if(t\u003c30) spaceOp=1-win(t,27,30);\n  else if(t\u003c255) spaceOp=0;\n  else spaceOp=win(t,255,258);\n  op(bgSpace,spaceOp);\n  op(bgPale, clamp(1-spaceOp,0,1));\n}\nfunction setHeading(t){\n  let cur=null;\n  for(const h of headings) if(t>=h.a&&t\u003c=h.b){cur=h;break;}\n  if(!cur){ op(headG,0); return; }\n  const fin = Math.min(win(t,cur.a,cur.a+0.6), 1-win(t,cur.b-0.6,cur.b));\n  op(headG, fin);\n  headText.textContent=cur.text;\n  headSub.textContent=\"\";\n  if(cur.style===\"space\"){ headText.setAttribute(\"fill\",\"#ffd24a\"); headText.setAttribute(\"stroke\",\"#0b1838\"); }\n  else { headText.setAttribute(\"fill\",\"#214a78\"); headText.setAttribute(\"stroke\",\"#ffffff\"); }\n}\nfunction setDialogue(t){\n  let cur=null;\n  for(const l of lines) if(t>=l[1]&&t\u003c=l[2]){cur=l;}\n  if(!cur){ op(dlgG,0); return; }\n  op(dlgG,1);\n  const who=cur[0], txt=cur[3];\n  dlgLabel.textContent=who+\":\";\n  dlgLabel.setAttribute(\"fill\", who===\"PRO\"?\"#ffd24a\":\"#8fd0ff\");\n  if(txt.length>1){\n    dlgLabel.setAttribute(\"y\",424);\n    dlgLine1.setAttribute(\"y\",424); dlgLine1.textContent=txt[0];\n    dlgLine2.setAttribute(\"y\",451); dlgLine2.textContent=txt[1]; op(dlgLine2,1);\n  }else{\n    dlgLabel.setAttribute(\"y\",437);\n    dlgLine1.setAttribute(\"y\",437); dlgLine1.textContent=txt[0];\n    dlgLine2.textContent=\"\"; op(dlgLine2,0);\n  }\n}\nfunction setLogo(t){\n  let o=0;\n  if(t\u003c6.8){ o=Math.min(win(t,0.6,1.6), 1-win(t,5.7,6.7)); }\n  else if(t>=258.6){ o=win(t,258.8,259.8); }\n  op(logoG,o);\n}\nfunction setFade(t){\n  let o=0;\n  if(t\u003c0.6) o=1-win(t,0,0.6);\n  if(t>260.3) o=Math.max(o, win(t,260.3,262));\n  op(fade,o);\n}\n\nfunction render(t){\n  t=clamp(t,0,TOTAL);\n  setBackgrounds(t);\n  for(const ph of phases){\n    const on = t>=ph.a && t\u003cph.b;\n    vis(ph.o.g, on);\n    if(ph.o.extra) for(const e of ph.o.extra) vis(e,on);\n    if(on) ph.o.update(t);\n  }\n  setHeading(t);\n  setDialogue(t);\n  setLogo(t);\n  setFade(t);\n}\n\n/* ============================================================\n   CLOCK + CONTROLS\n   ============================================================ */\nlet playing=false, cur=0, last=0;\nconst playBtn=document.getElementById(\"play\");\nconst playIcon=document.getElementById(\"playIcon\");\nconst restartBtn=document.getElementById(\"restart\");\nconst scrub=document.getElementById(\"scrub\");\nconst timeEl=document.getElementById(\"time\");\nconst PLAY='M8 5v14l11-7z', PAUSE='M6 5h4v14H6zM14 5h4v14h-4z';\n\nfunction fmt(s){ s=Math.max(0,Math.floor(s)); return Math.floor(s/60)+\":\"+String(s%60).padStart(2,\"0\"); }\nfunction syncUI(){\n  scrub.value=Math.round(cur/TOTAL*1000);\n  timeEl.textContent=fmt(cur)+\" / \"+fmt(TOTAL);\n  playIcon.setAttribute(\"d\", playing?PAUSE:PLAY);\n}\nfunction frame(now){\n  if(playing){\n    if(!last)last=now;\n    cur+=(now-last)/1000; last=now;\n    if(cur>=TOTAL){ cur=TOTAL; playing=false; }\n  }\n  render(cur); syncUI();\n  requestAnimationFrame(frame);\n}\nplayBtn.addEventListener(\"click\",()=>{\n  if(!playing){ if(cur>=TOTAL)cur=0; playing=true; last=0; }\n  else playing=false;\n  syncUI();\n});\nrestartBtn.addEventListener(\"click\",()=>{ cur=0; last=0; render(cur); syncUI(); });\nscrub.addEventListener(\"input\",()=>{ cur=scrub.value/1000*TOTAL; last=0; render(cur); syncUI(); });\n\nrender(0); syncUI();\nrequestAnimationFrame(frame);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"},
  "8": {"title": "Episode 8 — The Computer That Tries Everything", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>WHAT IF?.. — Episode 8: The Computer That Tries Everything\u003c/title>\n\u003cstyle>\n  :root{\n    --navy1:#0b183b; --navy2:#173f72;\n    --pale1:#dcf2fc; --pale2:#cfeafa;\n    --pro:#f0997b; --proDk:#c66a4f; --proSign:#8a3b28;\n    --el:#85b7eb; --elDk:#4f86c9; --elSign:#274f86;\n    --cyan:#4db7eb; --cyanDk:#378add;\n    --dlg:#0a1733; --dlgEdge:#4db7eb;\n    --yellow:#ffd24a; --headBlue:#214a78; --floor:#9bc4dd;\n  }\n  *{box-sizing:border-box;margin:0;padding:0}\n  html,body{height:100%}\n  body{\n    background:#05060c;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",system-ui,Arial,sans-serif;\n    color:#dfe9f5; display:flex; align-items:center; justify-content:center;\n    min-height:100vh; padding:18px;\n  }\n  .wrap{ width:min(960px,100%); }\n  .frame{\n    position:relative; width:100%; aspect-ratio:854/480;\n    border-radius:14px; overflow:hidden;\n    box-shadow:0 20px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(120,170,230,.18);\n    background:#0b183b;\n  }\n  svg#film{ position:absolute; inset:0; width:100%; height:100%; display:block; }\n  text{ font-family:\"Trebuchet MS\",\"Segoe UI\",system-ui,Arial,sans-serif; }\n\n  /* Controls */\n  .bar{\n    margin-top:12px; display:flex; align-items:center; gap:12px;\n    background:#0d1426; border:1px solid #1f2c47; border-radius:12px;\n    padding:9px 12px;\n  }\n  .btn{\n    appearance:none; border:none; cursor:pointer; color:#06101f;\n    background:linear-gradient(180deg,#7fc4f3,#4aa0e6);\n    font-weight:700; font-size:13px; letter-spacing:.3px;\n    width:42px; height:34px; border-radius:9px; display:flex;\n    align-items:center; justify-content:center; transition:filter .15s;\n    flex:0 0 auto;\n  }\n  .btn:hover{filter:brightness(1.08)}\n  .btn s ============\n   WHAT IF?.. — Episode 8: \"The Computer That Tries Everything\"\n   The maze episode. El can only run ONE corridor at a time —\n   until she learns the spinning coin. Physics: a bit is a\n   coin lying 0 OR 1; a qubit is a spun coin — 0 AND 1 at once\n   (superposition). A quantum computer explores many paths in\n   one moment; the wrong ones fade and the answer remains.\n   Climax: El \"splits\" into translucent copies and walks the\n   whole maze in a single instant.\n   Same slide style as Eps 1-7, one master clock `T`.\n   ============================================================ */\nconst SVGNS=\"http://www.w3.org/2000/svg\";\nconst film=document.getElementById(\"film\");\nconst W=854,H=480;\nconst TOTAL=262; // seconds (~4:22)\n\n/* ---------- tiny helpers ---------- */\nfunction S(tag,attrs,parent){\n  const e=document.createElementNS(SVGNS,tag);\n  if(attrs)for(const k in attrs){\n    if(k===\"text\"){e.textContent=attrs[k];}\n    else e.setAttribute(k,attrs[k]);\n  }\n  if(parent)parent.appendChild(e);\n  return e;\n}\nconst clamp=(v,a,b)=>v\u003ca?a:v>b?b:v;\nconst lerp=(a,b,p)=>a+(b-a)*p;\nconst ease=p=>{p=clamp(p,0,1);return p*p*p*(p*(p*6-15)+10);};\nconst easeOut=p=>{p=clamp(p,0,1);return 1-(1-p)*(1-p);};\nconst easeIn=p=>{p=clamp(p,0,1);return p*p;};\nconst win=(t,a,b)=>clamp((t-a)/(b-a),0,1);\nconst seg=(t,a,b)=>(t-a)/(b-a);\nfunction vis(el,on){ el.style.display=on?\"\":\"none\"; }\nfunction op(el,o){ el.setAttribute(\"opacity\",clamp(o,0,1)); }\nfunction tf(el,x,y,s,rot){\n  let t=`translate(${x.toFixed(2)} ${y.toFixed(2)})`;\n  if(rot)t+=` rotate(${rot.toFixed(2)})`;\n  if(s!=null&&s!==1)t+=` scale(${s.toFixed(3)})`;\n  el.setAttribute(\"transform\",t);\n}\nfunction prng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}\n// polyline helpers: total length + point at distance-fraction p\nfunction plen(pts){\n  let L=0;\n  1 — one path\",\"bit\");\n  const rowB=row(286,\"A qubit\",\"is 0 AND 1 — all paths\",\"qubit\");\n\n  return {g,update(t){\n    if(t\u003c243){\n      op(recap,0);\n      const finO=1-win(t,241,243);\n      op(finG,finO);\n      // El at the entrance: breathe, then SPLIT\n      let elX=108, elY=275, elS=0.7, alpha=1, mood=\"excited\";\n      if(t\u003c231){ elS=0.7*(1+0.1*Math.sin(t*2.6)); mood=\"happy\"; }\n      else if(t\u003c237){ alpha=lerp(1,0.12,ease(win(t,231,232.5))); mood=\"excited\"; }\n      else{\n        // reassembled at the exit\n        const pop=easeOut(win(t,237,238));\n        elX=762; elY=198; elS=0.75*(0.6+0.4*pop); alpha=win(t,237,237.8); mood=\"excited\";\n      }\n      el.set(elX,elY,elS,mood);\n      el.g.style.opacity=alpha.toFixed(3);\n      // the copies race every corridor at once\n      for(let i=0;i\u003c6;i++){\n        const p=win(t,231.5,236.2);\n        const q=pAt(routes[i],p);\n        const isOK=(i===3);\n        let o=finO*win(t,231.5,232.3)*0.9;\n        if(!isOK) o*=(1-win(t,236,237.4));\n        else o*=(1-win(t,236.8,237.6));   // the winner folds into El herself\n        ghosts[i].set(q.x,q.y+lanes[i],o, isOK? win(t,236,237)*finO:0);\n      }\n      // arrival burst\n      const br=easeOut(win(t,237,238.4));\n      op(flash, finO*(1-win(t,237,239.5))*0.9*win(t,237,237.3));\n      for(let i=0;i\u003cburst.length;i++){\n        const a=i/burst.length*Math.PI*2;\n        const r1=16+br*30, r2=24+br*46;\n        burst[i].setAttribute(\"x1\",(762+Math.cos(a)*r1).toFixed(1));\n        burst[i].setAttribute(\"y1\",(198+Math.sin(a)*r1).toFixed(1));\n        burst[i].setAttribute(\"x2\",(762+Math.cos(a)*r2).toFixed(1));\n        burst[i].setAttribute(\"y2\",(198+Math.sin(a)*r2).toFixed(1));\n        op(burst[i], finO*win(t,237,237.3)*(1-win(t,238.2,239.4)));\n      }\n      pro.set(70,356+bob(t,2.5,1.4),0.76, t\u003c237?\"happy\":\"soft\");\n    }else if(t\u003c256){\n      op(finG,0);\n      op(recap, win(t,244,246)*(1-win(t,254,256)));\n      op(rowA, win(t,244.5,246.5)); op(rowB, win(t,250,252));\n      pro.set(120,362+bob(t,3,1.6),0.8,\"happy\");\n      el.set(742,362+bob(t,4,2.2),0.78,\"excited\");\n    }else{\n      op(finG,0); op(recap,0);\n      pro.set(338,300+bob(t,3.5,1.8),0.92,\"happy\");\n      el.set(548,308+bob(t,5,2.6),0.86,\"excited\");\n    }\n  }};\n}\n\nconst P1=buildP1(),P2=buildP2(),P3=buildP3(),P4=buildP4(),P5=buildP5(),P6=buildP6();\nconst phases=[\n  {a:0,  b:30, o:P1},\n  {a:30, b:84, o:P2},\n  {a:84, b:132,o:P3},\n  {a:132,b:180,o:P4},\n  {a:180,b:228,o:P5},\n  {a:228,b:262,o:P6},\n];\n\n/* ============================================================\n   SCHEDULES\n   ============================================================ */\nconst headings=[\n  {a:8,  b:27,  text:\"Episode 8 — The Computer That Tries Everything\", style:\"space\"},\n  {a:31, b:82.5,text:\"One corridor at a time\",                  style:\"explain\"},\n  {a:86, b:131, text:\"A coin lying — and a coin spinning\",      style:\"explain\"},\n  {a:134,b:179, text:\"Every corridor at once\",                  style:\"explain\"},\n  {a:182,b:227, text:\"Millions of answers in a blink\",          style:\"explain\"},\n  {a:230,b:241.5,text:\"El's quantum run\",                       style:\"explain\"},\n  {a:243,b:254, text:\"Quick recap\",                             style:\"explain\"},\n  {a:256,b:261, text:\"What would YOU solve, trying it all?\",    style:\"space\"},\n];\n\nconst lines=[\n  [\"EL\",8.5,13,[\"Look at the SIZE of that maze!\",\"I can beat it. Probably. Maybe.\"]],\n  [\"PRO\",13.5,19,[\"Today we walk every road at once —\",\"and never get lost.\"]],\n  [\"EL\",19.5,23.5,[\"Every road at ONCE?!\",\"Roads don't work like that!\"]],\n  [\"PRO\",24,29.5,[\"Quantum roads do. In you go!\"]],\n\n  [\"EL\",32,37,[\"Easy! Exit, here I come — whoa. WALL.\"]],\n  [\"EL\",40,45.5,[\"Fine, up and over — ANOTHER wall?!\"]],\n  [\"EL\",48,55.5,[\"Down, right, right, right — NO!\",\"Who even builds these things?!\"]],\n  [\"EL\",57,63,[\"There are THOUSANDS of corridors,\",\"and I can try just one at a time...\"]],\n  [\"PRO\",64,70.5,[\"That's the slow way: one path,\",\"then another, then another.\"]],\n  [\"PRO\",71.5,77.5,[\"But what if you could try\",\"EVERY corridor at the same time?\"]],\n  [\"EL\",78.5,83.5,[\"All of them?! At once?! ...Can I?!\"]],\n\n  [\"PRO\",86.5,92.5,[\"Meet the ordinary bit: a coin\",\"lying flat on the table.\"]],\n  [\"PRO\",94,100.5,[\"Heads means 0. Tails means 1.\",\"It must always pick ONE side.\"]],\n  [\"EL\",102,108,[\"Zero or one, zero or one... that's\",\"how I ran the maze. One by one.\"]],\n  [\"PRO\",109.5,115.5,[\"Exactly. Now — the quantum coin.\",\"Give it a good spin...\"]],\n  [\"EL\",117,123,[\"It's a blur! Is it heads or tails?!\"]],\n  [\"PRO\",124,130.5,[\"While it spins — it's BOTH.\",\"That is called superposition.\"]],\n\n  [\"PRO\",135,141.5,[\"Now be the spinning coin, El.\",\"Stand at the entrance... and split.\"]],\n  [\"EL\",143,148.5,[\"Whoa — there's a whole crowd of me!\",\"We're taking EVERY corridor!\"]],\n  [\"PRO\",150,157,[\"A quantum computer does exactly this:\",\"many paths in a single moment.\"]],\n  [\"PRO\",158.5,165,[\"Then every wrong path simply fades...\"]],\n  [\"EL\",166.5,172.5,[\"...and the right one LIGHTS UP!\"]],\n  [\"PRO\",174,179.5,[\"One try. Every road. One answer.\"]],\n\n  [\"PRO\",183,189.5,[\"Give this power to medicine:\",\"millions of molecules to test.\"]],\n  [\"PRO\",191,197,[\"A quantum computer sifts them\",\"all at once — like our maze.\"]],\n  [\"EL\",198.5,203.5,[\"And THAT one's the cure! Found it!\"]],\n  [\"PRO\",205.5,212,[\"Or a whole city of streets —\",\"every route tried in one heartbeat.\"]],\n  [\"EL\",213.5,219,[\"All the wrong turns just... vanish!\"]],\n  [\"PRO\",220.5,227,[\"Only the golden road remains.\",\"No jams. No guessing. No waiting.\"]],\n\n  [\"EL\",228.5,231.5,[\"My turn. For REAL this time.\",\"Deep breath... and — SPLIT!\"]],\n  [\"EL\",232.5,236.5,[\"Every corridor! All of them!\",\"All at ONCE!\"]],\n  [\"EL\",237.5,243,[\"I'm out! I walked the WHOLE maze\",\"in a single instant!\"]],\n  [\"PRO\",246,251.5,[\"Sometimes the fastest path is not\",\"choosing one — it's trying them all.\"]],\n  [\"EL\",256.5,261,[\"Next time: pulling water\",\"out of thin air!\"]],\n];\n\n/* ============================================================\n   RENDER\n   ============================================================ */\nfunction setBackgrounds(t){\n  let spaceOp;\n  if(t\u003c27) spaceOp=1;\n  else if(t\u003c30) spaceOp=1-win(t,27,30);\n  else if(t\u003c255) spaceOp=0;\n  else spaceOp=win(t,255,258);\n  op(bgSpace,spaceOp);\n  op(bgPale, clamp(1-spaceOp,0,1));\n}\nfunction setHeading(t){\n  let cur=null;\n  for(const h of headings) if(t>=h.a&&t\u003c=h.b){cur=h;break;}\n  if(!cur){ op(headG,0); return; }\n  const fin = Math.min(win(t,cur.a,cur.a+0.6), 1-win(t,cur.b-0.6,cur.b));\n  op(headG, fin);\n  headText.textContent=cur.text;\n  headSub.textContent=\"\";\n  if(cur.style===\"space\"){ headText.setAttribute(\"fill\",\"#ffd24a\"); headText.setAttribute(\"stroke\",\"#0b1838\"); }\n  else { headText.setAttribute(\"fill\",\"#214a78\"); headText.setAttribute(\"stroke\",\"#ffffff\"); }\n}\nfunction setDialogue(t){\n  let cur=null;\n  for(const l of lines) if(t>=l[1]&&t\u003c=l[2]){cur=l;}\n  if(!cur){ op(dlgG,0); return; }\n  op(dlgG,1);\n  const who=cur[0], txt=cur[3];\n  dlgLabel.textContent=who+\":\";\n  dlgLabel.setAttribute(\"fill\", who===\"PRO\"?\"#ffd24a\":\"#8fd0ff\");\n  if(txt.length>1){\n    dlgLabel.setAttribute(\"y\",424);\n    dlgLine1.setAttribute(\"y\",424); dlgLine1.textContent=txt[0];\n    dlgLine2.setAttribute(\"y\",451); dlgLine2.textContent=txt[1]; op(dlgLine2,1);\n  }else{\n    dlgLabel.setAttribute(\"y\",437);\n    dlgLine1.setAttribute(\"y\",437); dlgLine1.textContent=txt[0];\n    dlgLine2.textContent=\"\"; op(dlgLine2,0);\n  }\n}\nfunction setLogo(t){\n  let o=0;\n  if(t\u003c6.8){ o=Math.min(win(t,0.6,1.6), 1-win(t,5.7,6.7)); }\n  else if(t>=258.6){ o=win(t,258.8,259.8); }\n  op(logoG,o);\n}\nfunction setFade(t){\n  let o=0;\n  if(t\u003c0.6) o=1-win(t,0,0.6);\n  if(t>260.3) o=Math.max(o, win(t,260.3,262));\n  op(fade,o);\n}\n\nfunction render(t){\n  t=clamp(t,0,TOTAL);\n  setBackgrounds(t);\n  for(const ph of phases){\n    const on = t>=ph.a && t\u003cph.b;\n    vis(ph.o.g, on);\n    if(ph.o.extra) for(const e of ph.o.extra) vis(e,on);\n    if(on) ph.o.update(t);\n  }\n  setHeading(t);\n  setDialogue(t);\n  setLogo(t);\n  setFade(t);\n}\n\n/* ============================================================\n   CLOCK + CONTROLS\n   ============================================================ */\nlet playing=false, cur=0, last=0;\nconst playBtn=document.getElementById(\"play\");\nconst playIcon=document.getElementById(\"playIcon\");\nconst restartBtn=document.getElementById(\"restart\");\nconst scrub=document.getElementById(\"scrub\");\nconst timeEl=document.getElementById(\"time\");\nconst PLAY='M8 5v14l11-7z', PAUSE='M6 5h4v14H6zM14 5h4v14h-4z';\n\nfunction fmt(s){ s=Math.max(0,Math.floor(s)); return Math.floor(s/60)+\":\"+String(s%60).padStart(2,\"0\"); }\nfunction syncUI(){\n  scrub.value=Math.round(cur/TOTAL*1000);\n  timeEl.textContent=fmt(cur)+\" / \"+fmt(TOTAL);\n  playIcon.setAttribute(\"d\", playing?PAUSE:PLAY);\n}\nfunction frame(now){\n  if(playing){\n    if(!last)last=now;\n    cur+=(now-last)/1000; last=now;\n    if(cur>=TOTAL){ cur=TOTAL; playing=false; }\n  }\n  render(cur); syncUI();\n  requestAnimationFrame(frame);\n}\nplayBtn.addEventListener(\"click\",()=>{\n  if(!playing){ if(cur>=TOTAL)cur=0; playing=true; last=0; }\n  else playing=false;\n  syncUI();\n});\nrestartBtn.addEventListener(\"click\",()=>{ cur=0; last=0; render(cur); syncUI(); });\nscrub.addEventListener(\"input\",()=>{ cur=scrub.value/1000*TOTAL; last=0; render(cur); syncUI(); });\n\nrender(0); syncUI();\nrequestAnimationFrame(frame);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"},
  "9": {"title": "Episode 9 — Water from Thin Air", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>WHAT IF?.. — Episode 9: Water from Thin Air\u003c/title>\n\u003cstyle>\n  :root{\n    --navy1:#0b183b; --navy2:#173f72;\n    --pale1:#dcf2fc; --pale2:#cfeafa;\n    --pro:#f0997b; --proDk:#c66a4f; --proSign:#8a3b28;\n    --el:#85b7eb; --elDk:#4f86c9; --elSign:#274f86;\n    --cyan:#4db7eb; --cyanDk:#378add;\n    --dlg:#0a1733; --dlgEdge:#4db7eb;\n    --yellow:#ffd24a; --headBlue:#214a78; --floor:#9bc4dd;\n  }\n  *{box-sizing:border-box;margin:0;padding:0}\n  html,body{height:100%}\n  body{\n    background:#05060c;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",system-ui,Arial,sans-serif;\n    color:#dfe9f5; display:flex; align-items:center; justify-content:center;\n    min-height:100vh; padding:18px;\n  }\n  .wrap{ width:min(960px,100%); }\n  .frame{\n    position:relative; width:100%; aspect-ratio:854/480;\n    border-radius:14px; overflow:hidden;\n    box-shadow:0 20px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(120,170,230,.18);\n    background:#0b183b;\n  }\n  svg#film{ position:absolute; inset:0; width:100%; height:100%; display:block; }\n  text{ font-family:\"Trebuchet MS\",\"Segoe UI\",system-ui,Arial,sans-serif; }\n\n  /* Controls */\n  .bar{\n    margin-top:12px; display:flex; align-items:center; gap:12px;\n    background:#0d1426; border:1px solid #1f2c47; border-radius:12px;\n    padding:9px 12px;\n  }\n  .btn{\n    appearance:none; border:none; cursor:pointer; color:#06101f;\n    background:linear-gradient(180deg,#7fc4f3,#4aa0e6);\n    font-weight:700; font-size:13px; letter-spacing:.3px;\n    width:42px; height:34px; border-radius:9px; display:flex;\n    align-items:center; justify-content:center; transition:filter .15s;\n    flex:0 0 auto;\n  }\n  .btn:hover{filter:brightness(1.08)}\n  .btn svg{width:16px;height:16px;fill Episode 9: \"Water from Thin Air\"\n   The desert episode — warm palette, relief in the finale.\n   El wilts in the dry heat: \"you can't drink air.\" But even\n   the driest air carries stray water molecules. Physics: a\n   cold glass fogs \"from nowhere\"; a sponge material with\n   millions of tiny pores catches those molecules by day and,\n   in the cool of night, gives them back as drops of clean\n   water. Future: a fridge-sized box watering a whole village.\n   Same slide style as Eps 1-8, one master clock `T`.\n   ============================================================ */\nconst SVGNS=\"http://www.w3.org/2000/svg\";\nconst film=document.getElementById(\"film\");\nconst W=854,H=480;\nconst TOTAL=262; // seconds (~4:22)\n\n/* ---------- tiny helpers ---------- */\nfunction S(tag,attrs,parent){\n  const e=document.createElementNS(SVGNS,tag);\n  if(attrs)for(const k in attrs){\n    if(k===\"text\"){e.textContent=attrs[k];}\n    else e.setAttribute(k,attrs[k]);\n  }\n  if(parent)parent.appendChild(e);\n  return e;\n}\nconst clamp=(v,a,b)=>v\u003ca?a:v>b?b:v;\nconst lerp=(a,b,p)=>a+(b-a)*p;\nconst ease=p=>{p=clamp(p,0,1);return p*p*p*(p*(p*6-15)+10);};\nconst easeOut=p=>{p=clamp(p,0,1);return 1-(1-p)*(1-p);};\nconst easeIn=p=>{p=clamp(p,0,1);return p*p;};\nconst win=(t,a,b)=>clamp((t-a)/(b-a),0,1);\nconst seg=(t,a,b)=>(t-a)/(b-a);\nfunction vis(el,on){ el.style.display=on?\"\":\"none\"; }\nfunction op(el,o){ el.setAttribute(\"opacity\",clamp(o,0,1)); }\nfunction tf(el,x,y,s,rot){\n  let t=`translate(${x.toFixed(2)} ${y.toFixed(2)})`;\n  if(rot)t+=` rotate(${rot.toFixed(2)})`;\n  if(s!=null&&s!==1)t+=` scale(${s.toFixed(3)})`;\n  el.setAttribute(\"transform\",t);\n}\nfunction prng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}\n\n/* ============================================================\n   LAYERS\n   ============================================================ */\nconst defs=S(\"defs\",null,film);\nlet g=S(\"linearGradient\",{id:\"gSpace\",x1:0,y1:0,x2:0,y2:1},defs);\nS(\"stop\",{offset:0,\"stop-color\":\"#0b1838\"},g);\nS(\"stop\",{offset:1,\"stop-color\":\"#173f72\"},g);\ng=S(\"linearGradient\",{id:\"gPale\",x1:0,y1:0,x2:0,y2:1},defs);\nS(\"stop\",{offset:0,\"stop-color\":\"#e3f4fd\"},g);\nS(\"stop\",{offset:1,\"stop-color\":\"#cbe8f9\"},g);\nlet rg=S(\"radialGradient\",{id:\"gSun\"},defs);\nS(\"stop\",{offset:0,\"stop-color\":\"#fff6c8\",\"stop-opacity\":1},rg);\nS(\"stop\",{offset:.5,\"stop-color\":\"#ffdf7a\",\"stop-opacity\":.85},rg);\nS(\"stop\",{offset:1,\"stop-color\":\"#ffdf7a\",\"stop-opacity\":0},rg);\nrg=S(\"radialGradient\",{id:\"gGlow\"},defs);\nS(\"stop\",{offset:0,\"stop-color\":\"#fff4c2\",\"stop-opacity\":.95},rg);\nS(\"stop\",{offset:1,\"stop-color\":\"#fff4c2\",\"stop-opacity\":0},rg);\n\n// Background layers\nconst bgSpace=S(\"g\",{id:\"bgSpace\"},film);\nS(\"rect\",{x:0,y:0,width:W,height:H,fill:\"url(#gSpace)\"},bgSpace);\nconst bgPale=S(\"g\",{id:\"bgPale\"},film);\nS(\"rect\",{x:0,y:0,width:W,height:H,fill:\"url(#gPale)\"},bgPale);\nS(\"line\",{x1:0,y1:312,x2:W,y2:312,stroke:\"#9bc4dd\",\"stroke-width\":2,opacity:.7},bgPale);\n\n// stars\n(function(){const r=prng(7);for(let i=0;i\u003c78;i++){\n  const x=r()*W,y=r()*H,rad=r()*1.5+0.6,o=r()*0.6+0.35;\n  S(\"circle\",{cx:x.toFixed(1),cy:y.toFixed(1),r:rad.toFixed(2),fill:\"#dceaff\",opacity:o.toFixed(2)},bgSpace);\n}})();\n// pale-bg dotted top border\n(function(){const r=prng(21);for(let i=0;i\u003c34;i++){\n  const x=10+i*25+ (r()*8-4), y=18+Math.sin(i*0.7)*10 + r()*8;\n  S(\"circle\",{cx:x.toFixed(1),cy:y.toFixed(1),r:(r()*1.6+1).toFixed(2),fill:\"#5ea3d4\",opacity:.55},bgPale);\n}})();\n\n// Scene container\nconst stage=S(\"g\",{id:\"stage\"},film);\n// Characters layer\nconst charLayer=S(\"g\",{id:\"chars\"},film);\n// Props in front of characters\nconst frontLayer=S(\"g\",{id:\"front\"},film);\n// Glow / sparkle layer abo ibute(\"fill\",\"#214a78\"); headText.setAttribute(\"stroke\",\"#ffffff\"); }\n}\nfunction setDialogue(t){\n  let cur=null;\n  for(const l of lines) if(t>=l[1]&&t\u003c=l[2]){cur=l;}\n  if(!cur){ op(dlgG,0); return; }\n  op(dlgG,1);\n  const who=cur[0], txt=cur[3];\n  dlgLabel.textContent=who+\":\";\n  dlgLabel.setAttribute(\"fill\", who===\"PRO\"?\"#ffd24a\":\"#8fd0ff\");\n  if(txt.length>1){\n    dlgLabel.setAttribute(\"y\",424);\n    dlgLine1.setAttribute(\"y\",424); dlgLine1.textContent=txt[0];\n    dlgLine2.setAttribute(\"y\",451); dlgLine2.textContent=txt[1]; op(dlgLine2,1);\n  }else{\n    dlgLabel.setAttribute(\"y\",437);\n    dlgLine1.setAttribute(\"y\",437); dlgLine1.textContent=txt[0];\n    dlgLine2.textContent=\"\"; op(dlgLine2,0);\n  }\n}\nfunction setLogo(t){\n  let o=0;\n  if(t\u003c6.8){ o=Math.min(win(t,0.6,1.6), 1-win(t,5.7,6.7)); }\n  else if(t>=258.6){ o=win(t,258.8,259.8); }\n  op(logoG,o);\n}\nfunction setFade(t){\n  let o=0;\n  if(t\u003c0.6) o=1-win(t,0,0.6);\n  if(t>260.3) o=Math.max(o, win(t,260.3,262));\n  op(fade,o);\n}\n\nfunction render(t){\n  t=clamp(t,0,TOTAL);\n  setBackgrounds(t);\n  for(const ph of phases){\n    const on = t>=ph.a && t\u003cph.b;\n    vis(ph.o.g, on);\n    if(ph.o.extra) for(const e of ph.o.extra) vis(e,on);\n    if(on) ph.o.update(t);\n  }\n  setHeading(t);\n  setDialogue(t);\n  setLogo(t);\n  setFade(t);\n}\n\n/* ============================================================\n   CLOCK + CONTROLS\n   ============================================================ */\nlet playing=false, cur=0, last=0;\nconst playBtn=document.getElementById(\"play\");\nconst playIcon=document.getElementById(\"playIcon\");\nconst restartBtn=document.getElementById(\"restart\");\nconst scrub=document.getElementById(\"scrub\");\nconst timeEl=document.getElementById(\"time\");\nconst PLAY='M8 5v14l11-7z', PAUSE='M6 5h4v14H6zM14 5h4v14h-4z';\n\nfunction fmt(s){ s=Math.max(0,Math.floor(s)); return Math.floor(s/60)+\":\"+String(s%60).padStart(2,\"0\"); }\nfunction syncUI(){\n  scrub.value=Math.round(cur/TOTAL*1000);\n  timeEl.textContent=fmt(cur)+\" / \"+fmt(TOTAL);\n  playIcon.setAttribute(\"d\", playing?PAUSE:PLAY);\n}\nfunction frame(now){\n  if(playing){\n    if(!last)last=now;\n    cur+=(now-last)/1000; last=now;\n    if(cur>=TOTAL){ cur=TOTAL; playing=false; }\n  }\n  render(cur); syncUI();\n  requestAnimationFrame(frame);\n}\nplayBtn.addEventListener(\"click\",()=>{\n  if(!playing){ if(cur>=TOTAL)cur=0; playing=true; last=0; }\n  else playing=false;\n  syncUI();\n});\nrestartBtn.addEventListener(\"click\",()=>{ cur=0; last=0; render(cur); syncUI(); });\nscrub.addEventListener(\"input\",()=>{ cur=scrub.value/1000*TOTAL; last=0; render(cur); syncUI(); });\n\nrender(0); syncUI();\nrequestAnimationFrame(frame);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"},
  "10": {"title": "Episode 10 — An Elevator to Space", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>WHAT IF?.. — Episode 10: An Elevator to Space (Season Finale)\u003c/title>\n\u003cstyle>\n  :root{\n    --navy1:#0b183b; --navy2:#173f72;\n    --pale1:#dcf2fc; --pale2:#cfeafa;\n    --pro:#f0997b; --proDk:#c66a4f; --proSign:#8a3b28;\n    --el:#85b7eb; --elDk:#4f86c9; --elSign:#274f86;\n    --cyan:#4db7eb; --cyanDk:#378add;\n    --dlg:#0a1733; --dlgEdge:#4db7eb;\n    --yellow:#ffd24a; --headBlue:#214a78; --floor:#9bc4dd;\n  }\n  *{box-sizing:border-box;margin:0;padding:0}\n  html,body{height:100%}\n  body{\n    background:#05060c;\n    font-family:\"Trebuchet MS\",\"Segoe UI\",system-ui,Arial,sans-serif;\n    color:#dfe9f5; display:flex; align-items:center; justify-content:center;\n    min-height:100vh; padding:18px;\n  }\n  .wrap{ width:min(960px,100%); }\n  .frame{\n    position:relative; width:100%; aspect-ratio:854/480;\n    border-radius:14px; overflow:hidden;\n    box-shadow:0 20px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(120,170,230,.18);\n    background:#0b183b;\n  }\n  svg#film{ position:absolute; inset:0; width:100%; height:100%; display:block; }\n  text{ font-family:\"Trebuchet MS\",\"Segoe UI\",system-ui,Arial,sans-serif; }\n\n  /* Controls */\n  .bar{\n    margin-top:12px; display:flex; align-items:center; gap:12px;\n    background:#0d1426; border:1px solid #1f2c47; border-radius:12px;\n    padding:9px 12px;\n  }\n  .btn{\n    appearance:none; border:none; cursor:pointer; color:#06101f;\n    background:linear-gradient(180deg,#7fc4f3,#4aa0e6);\n    font-weight:700; font-size:13px; letter-spacing:.3px;\n    width:42px; height:34px; border-radius:9px; display:flex;\n    align-items:center; justify-content:center; transition:filter .15s;\n    flex:0 0 auto;\n  }\n  .btn:hover{filter:brightness(1.08)}\n  .btn svg{width: ====================\n   WHAT IF?.. — Episode 10: \"An Elevator to Space\"\n   THE SEASON FINALE. Triumphant, quiet ending — for once,\n   even El falls silent.\n   El longs for the stars but a rocket launch terrifies her:\n   thunder, fire, shaking. Physics: a ball spun on a string\n   pulls the string taut — and a spinning Earth can hold a\n   cable taut too, if it's made of carbon nanotubes (stronger\n   than steel, feather-light). Then: a silent elevator ride\n   up as the sky fades from blue to black... doors opening on\n   \"FLOOR: SPACE\"... and the whole glowing Earth below.\n   Ends with \"End of Season One\". No recap, no teaser.\n   Same slide style as Eps 1-9, one master clock `T`.\n   ============================================================ */\nconst SVGNS=\"http://www.w3.org/2000/svg\";\nconst film=document.getElementById(\"film\");\nconst W=854,H=480;\nconst TOTAL=262; // seconds (~4:22)\n\n/* ---------- tiny helpers ---------- */\nfunction S(tag,attrs,parent){\n  const e=document.createElementNS(SVGNS,tag);\n  if(attrs)for(const k in attrs){\n    if(k===\"text\"){e.textContent=attrs[k];}\n    else e.setAttribute(k,attrs[k]);\n  }\n  if(parent)parent.appendChild(e);\n  return e;\n}\nconst clamp=(v,a,b)=>v\u003ca?a:v>b?b:v;\nconst lerp=(a,b,p)=>a+(b-a)*p;\nconst ease=p=>{p=clamp(p,0,1);return p*p*p*(p*(p*6-15)+10);};\nconst easeOut=p=>{p=clamp(p,0,1);return 1-(1-p)*(1-p);};\nconst easeIn=p=>{p=clamp(p,0,1);return p*p;};\nconst win=(t,a,b)=>clamp((t-a)/(b-a),0,1);\nconst seg=(t,a,b)=>(t-a)/(b-a);\nfunction vis(el,on){ el.style.display=on?\"\":\"none\"; }\nfunction op(el,o){ el.setAttribute(\"opacity\",clamp(o,0,1)); }\nfunction tf(el,x,y,s,rot){\n  let t=`translate(${x.toFixed(2)} ${y.toFixed(2)})`;\n  if(rot)t+=` rotate(${rot.toFixed(2)})`;\n  if(s!=null&&s!==1)t+=` scale(${s.toFixed(3)})`;\n  el.setAttribute(\"transform\",t);\n}\nfunction prng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}\n\n/* ============================================================\n   LAYERS\n   ============================================================ */\nconst defs=S(\"defs\",null,film);\nlet g=S(\"linearGradient\",{id:\"gSpace\",x1:0,y1:0,x2:0,y2:1},defs);\nS(\"stop\",{offset:0,\"stop-color\":\"#0b1838\"},g);\nS(\"stop\",{offset:1,\"stop-color\":\"#173f72\"},g);\ng=S(\"linearGradient\",{id:\"gPale\",x1:0,y1:0,x2:0,y2:1},defs);\nS(\"stop\",{offset:0,\"stop-color\":\"#e3f4fd\"},g);\nS(\"stop\",{offset:1,\"stop-color\":\"#cbe8f9\"},g);\nlet rg=S(\"radialGradient\",{id:\"gGlow\"},defs);\nS(\"stop\",{offset:0,\"stop-color\":\"#fff4c2\",\"stop-opacity\":.95},rg);\nS(\"stop\",{offset:1,\"stop-color\":\"#fff4c2\",\"stop-opacity\":0},rg);\nrg=S(\"radialGradient\",{id:\"gEarthGlow\"},defs);\nS(\"stop\",{offset:0,\"stop-color\":\"#9fd0ff\",\"stop-opacity\":0},rg);\nS(\"stop\",{offset:.78,\"stop-color\":\"#9fd0ff\",\"stop-opacity\":.05},rg);\nS(\"stop\",{offset:.93,\"stop-color\":\"#bfe4ff\",\"stop-opacity\":.4},rg);\nS(\"stop\",{offset:1,\"stop-color\":\"#dff2ff\",\"stop-opacity\":.7},rg);\n// clip for the elevator window\nlet cp=S(\"clipPath\",{id:\"winClip\"},defs);\nS(\"rect\",{x:253,y:146,width:348,height:188,rx:18},cp);\n// clip for the giant Earth\ncp=S(\"clipPath\",{id:\"earthClip\"},defs);\nS(\"circle\",{cx:427,cy:700,r:330},cp);\n\n// Background layers\nconst bgSpace=S(\"g\",{id:\"bgSpace\"},film);\nS(\"rect\",{x:0,y:0,width:W,height:H,fill:\"url(#gSpace)\"},bgSpace);\nconst bgPale=S(\"g\",{id:\"bgPale\"},film);\nS(\"rect\",{x:0,y:0,width:W,height:H,fill:\"url(#gPale)\"},bgPale);\nS(\"line\",{x1:0,y1:312,x2:W,y2:312,stroke:\"#9bc4dd\",\"stroke-width\":2,opacity:.7},bgPale);\n\n// stars\n(function(){const r=prng(7);for(let i=0;i\u003c90;i++){\n  const x=r()*W,y=r()*H,rad=r()*1.5+0.6,o=r()*0.6+0.35;\n  S(\"circle\",{cx:x.toFixed(1),cy:y.toFixed(1),r:rad.toFixed(2),fill:\"#dceaff\",opacity:o.toFixed(2)},bgSpace);\n}})() :180,y1:352,x2:674,y2:352,stroke:\"#67c3a6\",\"stroke-width\":6,\"stroke-linecap\":\"round\"},finG);\n  S(\"line\",{x1:180,y1:352,x2:674,y2:352,stroke:\"#dff2ec\",\"stroke-width\":2,\"stroke-dasharray\":\"10 12\"},finG);\n  S(\"line\",{x1:220,y1:352,x2:220,y2:368,stroke:\"#67c3a6\",\"stroke-width\":4},finG);\n  S(\"line\",{x1:634,y1:352,x2:634,y2:368,stroke:\"#67c3a6\",\"stroke-width\":4},finG);\n  // the tether continues past the platform\n  S(\"line\",{x1:427,y1:0,x2:427,y2:200,stroke:\"#9fd0ff\",\"stroke-width\":3,opacity:.4},finG);\n  // the sign\n  S(\"line\",{x1:600,y1:352,x2:600,y2:298,stroke:\"#93a7c2\",\"stroke-width\":4},finG);\n  S(\"rect\",{x:528,y:264,width:144,height:34,rx:8,fill:\"#0a1733\",stroke:\"#4db7eb\",\"stroke-width\":2.5},finG);\n  S(\"text\",{x:600,y:287,\"text-anchor\":\"middle\",\"font-size\":16,\"font-weight\":\"800\",fill:\"#ffd24a\",\"letter-spacing\":1,\n    text:\"FLOOR: SPACE\"},finG);\n  // the cabin, docked (front layer, to release the heroes)\n  const fr=S(\"g\",{},frontLayer);\n  const cab=S(\"g\",{},fr);\n  S(\"rect\",{x:-46,y:-52,width:92,height:104,rx:14,fill:\"#eaf6ff\",stroke:\"#67c3a6\",\"stroke-width\":3},cab);\n  S(\"circle\",{cx:0,cy:-16,r:19,fill:\"#bfe4ff\",\"fill-opacity\":.25,stroke:\"#67c3a6\",\"stroke-width\":2.6},cab);\n  S(\"line\",{x1:-46,y1:2,x2:46,y2:2,stroke:\"#67c3a6\",\"stroke-width\":2},cab);\n  const doorL=S(\"rect\",{x:-45,y:3,width:45,height:48,rx:4,fill:\"#dff2ec\",stroke:\"#67c3a6\",\"stroke-width\":2},cab);\n  const doorR=S(\"rect\",{x:0,y:3,width:45,height:48,rx:4,fill:\"#dff2ec\",stroke:\"#67c3a6\",\"stroke-width\":2},cab);\n  // arrival ding\n  const ding=S(\"circle\",{cx:427,cy:236,r:8,fill:\"url(#gGlow)\",opacity:0},finG);\n  // the little glint of starlight on El's cheek\n  const glint=S(\"g\",{opacity:0},glowLayer);\n  S(\"line\",{x1:-6,y1:0,x2:6,y2:0,stroke:\"#fff4c2\",\"stroke-width\":2,\"stroke-linecap\":\"round\"},glint);\n  S(\"line\",{x1:0,y1:-6,x2:0,y2:6,stroke:\"#fff4c2\",\"stroke-width\":2,\"stroke-linecap\":\"round\"},glint);\n  // the back-view silhouettes for the final shot\n  const backs=S(\"g\",{opacity:0},finG);\n  S(\"ellipse\",{cx:370,cy:352,rx:34,ry:7,fill:\"#05060c\",\"fill-opacity\":.35},backs);\n  S(\"path\",{d:\"M 336 320 q -8 -1 -11 4\",stroke:\"#c66a4f\",\"stroke-width\":4.4,fill:\"none\",\"stroke-linecap\":\"round\"},backs);\n  S(\"path\",{d:\"M 404 320 q 8 -1 11 4\",stroke:\"#c66a4f\",\"stroke-width\":4.4,fill:\"none\",\"stroke-linecap\":\"round\"},backs);\n  S(\"circle\",{cx:370,cy:318,r:37,fill:\"#f0997b\",stroke:\"#c66a4f\",\"stroke-width\":3},backs);\n  S(\"ellipse\",{cx:472,cy:356,rx:24,ry:5,fill:\"#05060c\",\"fill-opacity\":.35},backs);\n  S(\"path\",{d:\"M 448 330 q -7 -1 -9 3\",stroke:\"#4f86c9\",\"stroke-width\":4,fill:\"none\",\"stroke-linecap\":\"round\"},backs);\n  S(\"path\",{d:\"M 496 330 q 7 -1 9 3\",stroke:\"#4f86c9\",\"stroke-width\":4,fill:\"none\",\"stroke-linecap\":\"round\"},backs);\n  S(\"circle\",{cx:472,cy:328,r:26,fill:\"#85b7eb\",stroke:\"#4f86c9\",\"stroke-width\":3},backs);\n  return {g,extra:[fr,glint],update(t){\n    const finO=1;\n    op(finG,finO);\n    // Earth breathes very slightly\n    earth.setAttribute(\"transform\",`translate(0 ${(Math.sin(t*0.5)*2).toFixed(1)})`);\n    // cabin docked at the platform; doors open at 230-233\n    tf(cab,427,300);\n    op(cab, 1-win(t,240,244));\n    const open0=ease(win(t,230,233));\n    doorL.setAttribute(\"transform\",`translate(${(-open0*40).toFixed(1)} 0)`);\n    doorR.setAttribute(\"transform\",`translate(${(open0*40).toFixed(1)} 0)`);\n    op(ding, Math.min(win(t,228.5,228.8),1-win(t,229.4,230.2)));\n    // heroes step out onto the platform, then just... look\n    const swap=win(t,253,256);   // crossfade to the back view\n    if(t\u003c233.5){\n      pro.set(414,296,0.42,\"soft\");\n      el.set(441,300,0.4,\"surprised\");\n    }else{\n      const p=ease(win(t,233.5,238));\n      const px=lerp(414,352,p), py=lerp(296,318,p), ps=lerp(0.42,0.8,p);\n      const ex=lerp(441,486,p), ey=lerp(300,330,p), es=lerp(0.4,0.76,p);\n      pro.set(px,py+bob(t,1,0.9),ps,\"soft\");\n      el.set(ex,ey+bob(t,0.8,1.1),es, t\u003c247?\"surprised\":\"happy\");\n      pro.g.style.opacity=(1-swap).toFixed(3);\n      el.g.style.opacity=(1-swap).toFixed(3);\n    }\n    op(backs, swap);\n    // the glint of starlight\n    tf(glint, 500, 318+bob(t,0.8,1.1));\n    op(glint, Math.min(win(t,242,243),1-win(t,246,247.5))*(0.6+0.4*Math.sin(t*5)));\n  }};\n}\n\nconst P1=buildP1(),P2=buildP2(),P3=buildP3(),P4=buildP4(),P5=buildP5(),P6=buildP6();\nconst phases=[\n  {a:0,  b:30, o:P1},\n  {a:30, b:84, o:P2},\n  {a:84, b:132,o:P3},\n  {a:132,b:180,o:P4},\n  {a:180,b:228,o:P5},\n  {a:228,b:262,o:P6},\n];\n\n/* ============================================================\n   SCHEDULES\n   ============================================================ */\nconst headings=[\n  {a:8,  b:27,  text:\"Episode 10 — An Elevator to Space\", style:\"space\"},\n  {a:31, b:82.5,text:\"The loud way up\",                    style:\"explain\"},\n  {a:86, b:131, text:\"The ball on a string\",               style:\"explain\"},\n  {a:134,b:179, text:\"A cable to the sky\",                 style:\"explain\"},\n  {a:182,b:202, text:\"Going up\",                           style:\"explain\"},\n  {a:232,b:242, text:\"Floor: Space\",                       style:\"space\"},\n  {a:249,b:258, text:\"Just ask: what if?..\",               style:\"space\"},\n];\n\nconst lines=[\n  [\"EL\",8.5,13,[\"It's the FINALE! Our very last ride!\",\"Let's make it the best one.\"]],\n  [\"PRO\",13.5,19,[\"Today we go all the way up —\",\"without a single rocket.\"]],\n  [\"EL\",19.5,23.5,[\"To space? With no rocket?\",\"How — do we JUMP?\"]],\n  [\"PRO\",24,29.5,[\"We ride. Quietly. You'll see.\"]],\n\n  [\"EL\",32.5,38.5,[\"Look at them all... the stars...\",\"I want to go SO badly.\"]],\n  [\"EL\",40,43,[\"Oh! A launch! Three... two... one...\"]],\n  [\"EL\",44,49,[\"WAAAH! The noise! The shaking!\",\"The FIRE! Hide me, hide me!\"]],\n  [\"EL\",51,57,[\"Is it gone?...\",\"My sparks are still trembling.\"]],\n  [\"EL\",58.5,64.5,[\"I want the stars, Pro. But not\",\"like THAT. It's too scary.\"]],\n  [\"EL\",65.5,70,[\"Is thunder and fire really\",\"the only way up?\"]],\n  [\"PRO\",71,77.5,[\"What if we rose to the stars\",\"quietly... like in an elevator?\"]],\n  [\"EL\",78.5,83.5,[\"An elevator... to SPACE?!\"]],\n\n  [\"PRO\",86.5,92.5,[\"Watch this ball on a string.\",\"Round and round it goes...\"]],\n  [\"PRO\",94,100.5,[\"See how the string pulls tight?\",\"The spin itself holds it up.\"]],\n  [\"EL\",102,108,[\"The string is standing in the air!\",\"Nothing holds it — but it HOLDS!\"]],\n  [\"PRO\",109.5,116,[\"Now think bigger. MUCH bigger.\",\"Our whole Earth is spinning too.\"]],\n  [\"PRO\",117.5,124.5,[\"Stretch a cable far enough up,\",\"and the spin pulls IT taut as well.\"]],\n  [\"EL\",126,131,[\"A string... for the whole PLANET?!\"]],\n\n  [\"PRO\",135,141,[\"First try: the strongest rope\",\"we could ever weave. Up it goes...\"]],\n  [\"EL\",141.5,145,[\"Aaand — SNAP. Rope confetti.\"]],\n  [\"PRO\",146,153,[\"Too heavy for itself. We need\",\"carbon nanotubes instead —\"]],\n  [\"PRO\",154,160.5,[\"a weave of tiny carbon rings:\",\"stronger than steel, light as air.\"]],\n  [\"EL\",162,167,[\"Can I touch it? Just a tiny pluck...\"]],\n  [\"EL\",168.5,174.5,[\"It SINGS! Like a giant guitar string —\",\"and it holds. It really holds!\"]],\n  [\"PRO\",175.5,179.5,[\"Taut from Earth to orbit. Ready to ride.\"]],\n\n  [\"PRO\",183,189,[\"Your carriage, madam. No fire,\",\"no thunder. Just up.\"]],\n  [\"EL\",190,195,[\"Okay. Deep breath. Doors, please.\"]],\n  [\"PRO\",197,203,[\"Going up: sky, stratosphere,\",\"stars... and space.\"]],\n  [\"EL\",205,210,[\"The sky is turning dark blue...\",\"now navy... now...\"]],\n  [\"PRO\",224.5,227.5,[\"Almost there, little spark.\"]],\n\n  [\"EL\",229,232.5,[\"We... stopped? Already? It was so\",\"quiet I forgot to be scared.\"]],\n  [\"PRO\",233.5,237,[\"Doors opening. After you.\"]],\n  [\"EL\",247.5,249.5,[\"...wow.\"]],\n  [\"PRO\",251,255.5,[\"Everything that seemed impossible,\",\"physics one day makes ordinary.\"]],\n  [\"PRO\",256,260,[\"You only need to ask:\",\"what if?..\"]],\n];\n\n/* ============================================================\n   RENDER\n   ============================================================ */\nfunction setBackgrounds(t){\n  let spaceOp;\n  if(t\u003c27) spaceOp=1;\n  else if(t\u003c30) spaceOp=1-win(t,27,30);\n  else spaceOp=win(t,214,224);   // night returns for the ascent and stays for the finale\n  op(bgSpace,spaceOp);\n  op(bgPale, clamp(1-spaceOp,0,1));\n}\nfunction setHeading(t){\n  let cur=null;\n  for(const h of headings) if(t>=h.a&&t\u003c=h.b){cur=h;break;}\n  if(!cur){ op(headG,0); return; }\n  const fin = Math.min(win(t,cur.a,cur.a+0.6), 1-win(t,cur.b-0.6,cur.b));\n  op(headG, fin);\n  headText.textContent=cur.text;\n  headSub.textContent=\"\";\n  if(cur.style===\"space\"){ headText.setAttribute(\"fill\",\"#ffd24a\"); headText.setAttribute(\"stroke\",\"#0b1838\"); }\n  else { headText.setAttribute(\"fill\",\"#214a78\"); headText.setAttribute(\"stroke\",\"#ffffff\"); }\n}\nfunction setDialogue(t){\n  let cur=null;\n  for(const l of lines) if(t>=l[1]&&t\u003c=l[2]){cur=l;}\n  if(!cur){ op(dlgG,0); return; }\n  op(dlgG,1);\n  const who=cur[0], txt=cur[3];\n  dlgLabel.textContent=who+\":\";\n  dlgLabel.setAttribute(\"fill\", who===\"PRO\"?\"#ffd24a\":\"#8fd0ff\");\n  if(txt.length>1){\n    dlgLabel.setAttribute(\"y\",424);\n    dlgLine1.setAttribute(\"y\",424); dlgLine1.textContent=txt[0];\n    dlgLine2.setAttribute(\"y\",451); dlgLine2.textContent=txt[1]; op(dlgLine2,1);\n  }else{\n    dlgLabel.setAttribute(\"y\",437);\n    dlgLine1.setAttribute(\"y\",437); dlgLine1.textContent=txt[0];\n    dlgLine2.textContent=\"\"; op(dlgLine2,0);\n  }\n}\nfunction setLogo(t){\n  let o=0;\n  if(t\u003c6.8){ o=Math.min(win(t,0.6,1.6), 1-win(t,5.7,6.7)); }\n  else if(t>=258.6){ o=win(t,258.8,259.8); }\n  logoSub.textContent = t>=258? \"— End of Season One —\" : \"Future Physics in 6 Minutes\";\n  op(logoG,o);\n}\nfunction setFade(t){\n  let o=0;\n  if(t\u003c0.6) o=1-win(t,0,0.6);\n  if(t>260.6) o=Math.max(o, win(t,260.6,262));\n  op(fade,o);\n}\n\nfunction render(t){\n  t=clamp(t,0,TOTAL);\n  setBackgrounds(t);\n  for(const ph of phases){\n    const on = t>=ph.a && t\u003cph.b;\n    vis(ph.o.g, on);\n    if(ph.o.extra) for(const e of ph.o.extra) vis(e,on);\n    if(on) ph.o.update(t);\n  }\n  setHeading(t);\n  setDialogue(t);\n  setLogo(t);\n  setFade(t);\n}\n\n/* ============================================================\n   CLOCK + CONTROLS\n   ============================================================ */\nlet playing=false, cur=0, last=0;\nconst playBtn=document.getElementById(\"play\");\nconst playIcon=document.getElementById(\"playIcon\");\nconst restartBtn=document.getElementById(\"restart\");\nconst scrub=document.getElementById(\"scrub\");\nconst timeEl=document.getElementById(\"time\");\nconst PLAY='M8 5v14l11-7z', PAUSE='M6 5h4v14H6zM14 5h4v14h-4z';\n\nfunction fmt(s){ s=Math.max(0,Math.floor(s)); return Math.floor(s/60)+\":\"+String(s%60).padStart(2,\"0\"); }\nfunction syncUI(){\n  scrub.value=Math.round(cur/TOTAL*1000);\n  timeEl.textContent=fmt(cur)+\" / \"+fmt(TOTAL);\n  playIcon.setAttribute(\"d\", playing?PAUSE:PLAY);\n}\nfunction frame(now){\n  if(playing){\n    if(!last)last=now;\n    cur+=(now-last)/1000; last=now;\n    if(cur>=TOTAL){ cur=TOTAL; playing=false; }\n  }\n  render(cur); syncUI();\n  requestAnimationFrame(frame);\n}\nplayBtn.addEventListener(\"click\",()=>{\n  if(!playing){ if(cur>=TOTAL)cur=0; playing=true; last=0; }\n  else playing=false;\n  syncUI();\n});\nrestartBtn.addEventListener(\"click\",()=>{ cur=0; last=0; render(cur); syncUI(); });\nscrub.addEventListener(\"input\",()=>{ cur=scrub.value/1000*TOTAL; last=0; render(cur); syncUI(); });\n\nrender(0); syncUI();\nrequestAnimationFrame(frame);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}

<script>
"use strict";

const pageTitles = {"home": "WHAT IF?.. — Future Physics in 6 Minutes", "episodes": "Episodes — WHAT IF?..", "about": "About — WHAT IF?..", "motive": "Motive — WHAT IF?.."};
const main = document.querySelector("#main");
const siteHeader = document.querySelector(".site-header");
const siteFooter = document.querySelector(".site-footer");
const watchHeader = document.querySelector(".watch-header");
const episodeName = document.querySelector("#episode-name");
const navigation = document.querySelectorAll(".site-nav a");
let episodes;

function renderPage(moveFocus = false) {
  const route = window.location.hash.slice(1);
  const number = /^episode-(\d+)$/.exec(route)?.[1];
  const isEpisode = number !== undefined;
  const page = Object.hasOwn(pageTitles, route) ? route : "home";

  siteHeader.hidden = isEpisode;
  siteFooter.hidden = isEpisode;
  watchHeader.hidden = !isEpisode;

  if (isEpisode) {
    episodes ??= JSON.parse(document.querySelector("#episode-library").textContent);
    const episode = episodes[number];
    const template = document.querySelector(episode ? "#page-watch" : "#page-missing");
    main.replaceChildren(template.content.cloneNode(true));
    episodeName.textContent = episode?.title ?? "";
    document.title = episode ? episode.title + " — WHAT IF?.." : "Episode not found — WHAT IF?..";
    if (episode) {
      const frame = main.querySelector("iframe");
      frame.title = episode.title;
      frame.srcdoc = episode.html;
    }
  } else {
    const template = document.querySelector("#page-" + page);
    main.replaceChildren(template.content.cloneNode(true));
    document.title = pageTitles[page];
  }

  for (const link of navigation) {
    if (!isEpisode && link.getAttribute("href") === "#" + page) {
      link.setAttribute("aria-current", "page");
    } else {
      link.removeAttribute("aria-current");
    }
  }

  if (moveFocus) {
    main.focus({ preventScroll: true });
    window.scrollTo(0, 0);
  }
}

document.querySelector(".skip-link").addEventListener("click", (event) => {
  event.preventDefault();
  main.focus();
});
window.addEventListener("hashchange", () => renderPage(true));
renderPage();
</script>
